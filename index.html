<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康追蹤網站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Charts Library -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, getDocs, orderBy, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setLogLevel('debug');

        let userId = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const apiKey = "";

        async function signIn() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    userId = userCredential.user.uid;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    userId = userCredential.user.uid;
                }
                document.getElementById('status').textContent = '已登入。使用者 ID：' + userId;
                return userId;
            } catch (error) {
                console.error("Firebase 登入失敗: ", error);
                document.getElementById('status').textContent = '登入失敗。請檢查設定。';
                return null;
            }
        }
        
        async function fetchDataAndDrawChart() {
            if (!userId) {
                await signIn();
            }
            if (!userId) return;

            const q = query(collection(db, 'artifacts', appId, 'users', userId, 'healthData'));
            const querySnapshot = await getDocs(q);
            const data = [];
            querySnapshot.forEach((doc) => {
                const docData = doc.data();
                data.push({ date: doc.id, ...docData });
            });

            // Sort data by date
            data.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Display data in a list
            const dataList = document.getElementById('data-list');
            dataList.innerHTML = '';
            if (data.length === 0) {
                dataList.innerHTML = '<p class="text-gray-500 text-center">目前沒有數據。請輸入一些數據來開始追蹤吧！</p>';
                document.getElementById('chart_div').style.display = 'none';
            } else {
                document.getElementById('chart_div').style.display = 'block';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'p-2 bg-gray-50 rounded-lg shadow-sm mb-2';
                    li.innerHTML = `
                        <div class="font-semibold text-gray-800">${item.date}</div>
                        <div class="text-sm text-gray-600">
                            體重: ${item.weight ? item.weight + ' 公斤' : '無'} |
                            血壓: ${item.bloodPressure ? item.bloodPressure : '無'} |
                            心率: ${item.heartRate ? item.heartRate + ' bpm' : '無'} |
                            飲水量: ${item.waterIntake ? item.waterIntake + ' ml' : '無'}
                        </div>
                    `;
                    dataList.appendChild(li);
                });

                // Draw the chart
                google.charts.load('current', {'packages':['corechart']});
                google.charts.setOnLoadCallback(function() {
                    const chartData = [['日期', '體重 (kg)']];
                    data.forEach(item => {
                        if (item.weight) {
                            chartData.push([item.date, item.weight]);
                        }
                    });

                    if (chartData.length <= 1) {
                         document.getElementById('chart_div').innerHTML = '<p class="text-gray-500 text-center">需要至少兩筆體重數據才能繪製圖表。</p>';
                         return;
                    }

                    const dataTable = google.visualization.arrayToDataTable(chartData);
                    const options = {
                        title: '體重變化曲線圖',
                        curveType: 'function',
                        legend: { position: 'bottom' },
                        colors: ['#3B82F6'],
                        hAxis: { title: '日期' },
                        vAxis: { title: '體重 (kg)' },
                        chartArea: { width: '85%', height: '70%' }
                    };
                    const chart = new google.visualization.LineChart(document.getElementById('chart_div'));
                    chart.draw(dataTable, options);
                });
            }
        }

        window.saveData = async function() {
            if (!userId) {
                await signIn();
            }

            const weightInput = document.getElementById('weight').value;
            const bloodPressureInput = document.getElementById('blood-pressure').value;
            const heartRateInput = document.getElementById('heart-rate').value;
            const waterIntakeInput = document.getElementById('water-intake').value;
            const today = new Date().toISOString().slice(0, 10);
            const timestamp = new Date();

            if (!weightInput && !bloodPressureInput && !heartRateInput && !waterIntakeInput) {
                document.getElementById('error-message').textContent = '請至少輸入一項數據！';
                document.getElementById('error-message').classList.remove('hidden');
                setTimeout(() => document.getElementById('error-message').classList.add('hidden'), 3000);
                return;
            }

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'healthData', today);
                const dataToSave = { timestamp: timestamp };
                if (weightInput) dataToSave.weight = parseFloat(weightInput);
                if (bloodPressureInput) dataToSave.bloodPressure = bloodPressureInput;
                if (heartRateInput) dataToSave.heartRate = parseInt(heartRateInput, 10);
                if (waterIntakeInput) dataToSave.waterIntake = parseInt(waterIntakeInput, 10);

                await setDoc(docRef, dataToSave, { merge: true });

                document.getElementById('message').textContent = '數據已成功儲存！';
                document.getElementById('message').classList.remove('hidden');
                setTimeout(() => document.getElementById('message').classList.add('hidden'), 3000);

                // Refresh data display
                fetchDataAndDrawChart();
            } catch (e) {
                console.error("寫入 Firestore 錯誤: ", e);
                document.getElementById('message').textContent = '儲存失敗，請檢查主控台。';
                document.getElementById('message').classList.add('text-red-700', 'bg-red-100');
                document.getElementById('message').classList.remove('hidden');
            }
        }
        
        window.sendMessage = async function() {
            const chatInput = document.getElementById('chat-input');
            const chatMessage = chatInput.value.trim();
            if (!chatMessage) return;

            const chatbox = document.getElementById('chat-box');
            
            // Add user message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'flex justify-end mb-2';
            userMessageDiv.innerHTML = `<div class="bg-blue-500 text-white p-2 rounded-lg max-w-xs">${chatMessage}</div>`;
            chatbox.appendChild(userMessageDiv);
            chatbox.scrollTop = chatbox.scrollHeight;

            chatInput.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start mb-2';
            loadingDiv.innerHTML = `<div class="bg-gray-200 text-gray-700 p-2 rounded-lg max-w-xs animate-pulse">思考中...</div>`;
            chatbox.appendChild(loadingDiv);
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const payload = {
                    contents: [{ parts: [{ text: chatMessage }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: "你是一位AI健康諮詢師。請提供簡潔、有幫助的健康建議，並盡可能根據用戶輸入的資訊給予個人化指導。回答應以友善和鼓勵的語氣呈現。" }]
                    },
                };
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                const sources = result?.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(attr => attr.web?.uri) || [];
                
                // Remove loading indicator
                chatbox.removeChild(loadingDiv);

                const botMessageDiv = document.createElement('div');
                botMessageDiv.className = 'flex justify-start mb-2';
                botMessageDiv.innerHTML = `<div class="bg-gray-200 text-gray-700 p-2 rounded-lg max-w-xs">${text}</div>`;
                chatbox.appendChild(botMessageDiv);
                chatbox.scrollTop = chatbox.scrollHeight;
            } catch (error) {
                console.error("AI 服務呼叫失敗:", error);
                chatbox.removeChild(loadingDiv);
                const errorMessageDiv = document.createElement('div');
                errorMessageDiv.className = 'flex justify-start mb-2';
                errorMessageDiv.innerHTML = `<div class="bg-red-200 text-red-700 p-2 rounded-lg max-w-xs">AI 服務出錯，請稍後再試。</div>`;
                chatbox.appendChild(errorMessageDiv);
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        }
        
        window.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.id === 'chat-input') {
                sendMessage();
            }
        });

        // Initial sign-in and data fetch on page load
        signIn().then(() => {
            fetchDataAndDrawChart();
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center font-sans p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-4">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">健康追蹤</h1>
        <p id="status" class="text-xs text-gray-500 text-center mb-4">正在登入...</p>
        
        <div class="space-y-4 mb-6">
            <div>
                <label for="weight" class="block text-gray-700 font-medium mb-1">體重 (公斤)</label>
                <input type="number" id="weight" name="weight" placeholder="例如: 65.5" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="blood-pressure" class="block text-gray-700 font-medium mb-1">血壓 (收縮壓/舒張壓)</label>
                <input type="text" id="blood-pressure" name="blood-pressure" placeholder="例如: 120/80" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="heart-rate" class="block text-gray-700 font-medium mb-1">心率 (bpm)</label>
                <input type="number" id="heart-rate" name="heart-rate" placeholder="例如: 75" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="water-intake" class="block text-gray-700 font-medium mb-1">飲水量 (ml)</label>
                <input type="number" id="water-intake" name="water-intake" placeholder="例如: 2000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <button onclick="saveData()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            儲存所有數據
        </button>
        
        <div id="message" class="mt-4 p-3 text-sm text-center font-bold text-green-700 bg-green-100 rounded-lg hidden" role="alert">
            <!-- 數據儲存成功/失敗訊息 -->
        </div>
        <div id="error-message" class="mt-4 p-3 text-sm text-center font-bold text-red-700 bg-red-100 rounded-lg hidden" role="alert">
            <!-- 錯誤訊息 -->
        </div>
    </div>

    <!-- Data Display and Chart Section -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-4">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">數據概覽</h2>
        <div id="chart_div" class="w-full h-80 mb-4"></div>
        <ul id="data-list" class="space-y-2">
            <!-- Data will be loaded here -->
        </ul>
    </div>

    <!-- AI Chat Section -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-4 flex flex-col h-96">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">AI 健康諮詢</h2>
        <div id="chat-box" class="flex-grow overflow-y-auto mb-4 p-2 border border-gray-200 rounded-lg bg-gray-50 space-y-2">
            <!-- Chat messages will be appended here -->
        </div>
        <div class="flex">
            <input type="text" id="chat-input" placeholder="問問 AI 有關健康的建議..." class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-r-lg hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                傳送
            </button>
        </div>
    </div>
</body>
</html>
