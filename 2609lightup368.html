<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用運動點亮台灣 368 鄉鎮區 | MySports</title>
  <style>
    :root {
      --bg:#faf8f4;
      --bg-elev:#ffffff;
      --bg-elev-2:#f3f0e8;
      --hairline:#e4dfd2;
      --border-strong:#d8d2c0;
      --text:#211d17;
      --text-dim:#5c5648;
      --text-faint:#71695a;
      --accent-1:#ff6a3d;
      --accent-2:#ffb238;
      --accent-grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
      --accent-soft:#ff6a3d1f;
      --water:#eef3f6;
      --lvl0:#e2ddd0;
      --lvl1:#4f9d6e;
      --lvl2:#eab308;
      --lvl3:#ea580c;
      --lvl4:#dc2626;
      --lvl5:#3730a3;
      --lvl6:#7e22ce;
      --shadow-card:0 1px 2px rgba(33,29,23,.05), 0 12px 28px -14px rgba(33,29,23,.18);
      --radius-s:10px;
      --radius-m:16px;
      --radius-l:22px;
      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
      color-scheme: light;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; }
    body {
      background:
        radial-gradient(900px 460px at 88% -8%, #ffe9d6 0%, transparent 60%),
        radial-gradient(700px 420px at -8% 6%, #fff2df 0%, transparent 55%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    .num { font-variant-numeric:tabular-nums; letter-spacing:0.01em; }
    .page {
      max-width:540px;
      margin:0 auto;
      padding:var(--sp-5) var(--sp-4) var(--sp-7);
      display:flex;
      flex-direction:column;
      gap:var(--sp-6);
    }
    a,button { font:inherit; color:inherit; }

    /* ---------- Hero ---------- */
    .hero { position:relative; padding-top:var(--sp-2); }
    .brand { display:flex; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-4); }
    .brand-mark { width:30px; height:30px; flex:none; }
    .brand-word { font-size:13px; font-weight:700; letter-spacing:0.16em; color:var(--text-dim); }
    .brand-word b { color:var(--text); font-weight:700; }
    .hero h1 {
      font-size:32px; line-height:1.22; font-weight:700; margin:0 0 var(--sp-3);
      text-wrap:balance; letter-spacing:-0.01em;
    }
    .hero h1 em {
      font-style:normal;
      background:var(--accent-grad);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .hero p { margin:0; font-size:14.5px; line-height:1.6; color:var(--text-dim); }

    /* ---------- Stat tiles ---------- */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-3); }
    .stat {
      background:var(--bg-elev); border:1px solid var(--hairline);
      box-shadow:var(--shadow-card); border-radius:var(--radius-m);
      padding:var(--sp-4) var(--sp-3); display:flex; flex-direction:column; gap:6px; min-width:0;
    }
    .stat .k { font-size:11.5px; font-weight:700; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat .v { font-size:24px; font-weight:700; line-height:1.05; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat .v small { font-size:13px; font-weight:600; color:var(--text-dim); }
    .stat.accent .v { background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* ---------- Query & Filters ---------- */
    .section-label { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-3); }
    .section-label h2 { font-size:16px; margin:0; font-weight:700; }
    .section-label .hint { font-size:12px; color:var(--text-faint); }
    .segmented { display:flex; gap:var(--sp-2); overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
    .segmented::-webkit-scrollbar { display:none; }
    .chip {
      flex:none; appearance:none; border:1px solid var(--hairline); background:var(--bg-elev);
      color:var(--text-dim); font-size:13.5px; font-weight:600;
      padding:8px 16px; border-radius:999px; cursor:pointer;
      transition:background .18s, color .18s, border-color .18s, transform .12s; min-height:40px;
    }
    .chip:active { transform:scale(0.96); }
    .chip[aria-selected="true"] { background:var(--accent-grad); border-color:transparent; color:#1a0e05; }
    .custom-picker {
      margin-top:var(--sp-3); display:flex; align-items:center; gap:var(--sp-3);
      background:var(--bg-elev); border:1px solid var(--hairline); box-shadow:var(--shadow-card);
      border-radius:var(--radius-s); padding:var(--sp-2) var(--sp-3);
    }
    .custom-picker label { font-size:13px; color:var(--text-dim); flex:none; }
    .custom-picker input[type="month"] {
      flex:1; min-width:0; background:var(--bg-elev-2); border:1px solid var(--hairline);
      color:var(--text); border-radius:8px; padding:8px 10px; font-size:14px; min-height:38px;
    }
    .custom-picker[hidden] { display:none; }
    .query-status {
      margin:var(--sp-3) 0 0; display:flex; align-items:center; gap:8px;
      font-size:13.5px; color:var(--text-dim); min-height:20px;
    }
    .query-status svg { flex:none; color:var(--accent-2); }
    .query-status b.num { color:var(--text); font-weight:700; }

    /* ---------- Map card ---------- */
    .map-card {
      background:var(--bg-elev); border:1px solid var(--hairline);
      box-shadow:var(--shadow-card); border-radius:var(--radius-l); padding:var(--sp-4);
    }
    .map-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-3); }
    .map-card-head h2 { font-size:16px; margin:0; font-weight:700; }
    .offshore { display:flex; gap:var(--sp-2); }
    .offshore-chip {
      display:flex; align-items:center; gap:6px; background:var(--bg-elev-2);
      border:1px solid var(--hairline); border-radius:999px;
      padding:6px 10px; font-size:11.5px; color:var(--text-dim); cursor:pointer; min-height:30px;
    }
    .offshore-chip .dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .map-wrap {
      position:relative; border-radius:var(--radius-m); overflow:hidden;
      background:radial-gradient(420px 420px at 70% 15%, #e4edf1 0%, transparent 65%), var(--water);
    }
    .map-wrap svg { display:block; width:100%; height:auto; }
    .county-path { stroke:#c7c0ac; stroke-width:1; cursor:pointer; transition:filter .15s ease; paint-order:stroke; }
    .county-path:hover { filter:brightness(0.92); }
    .county-path.selected { stroke:#211d17; stroke-width:2.2; }
    .county-hit { fill:transparent; cursor:pointer; }
    .map-county-label {
      font-size:15px; font-weight:700; fill:var(--text); stroke:#ffffff; stroke-width:4px;
      stroke-linejoin:round; pointer-events:none; user-select:none;
    }

    /* ---------- Legend ---------- */
    .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:var(--sp-4); }
    .legend-item {
      display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);
      background:var(--bg-elev-2); border:1px solid var(--hairline); padding:4px 9px; border-radius:999px;
    }
    .legend-item .sw { width:10px; height:10px; border-radius:3px; flex:none; }

    /* ---------- 368 鄉鎮區分類與查詢 ---------- */
    .township-section {
      margin-top:var(--sp-4); border-top:1px dashed var(--hairline); padding-top:var(--sp-4);
    }
    .filter-bar {
      display:flex; flex-direction:column; gap:var(--sp-2); margin-bottom:var(--sp-3);
    }
    .filter-row { display:flex; gap:8px; align-items:center; }
    .filter-row select, .filter-row input {
      background:var(--bg-elev-2); border:1px solid var(--hairline);
      border-radius:var(--radius-s); padding:8px 12px; font-size:13.5px; color:var(--text); font-family:inherit;
    }
    .filter-row select { flex:1; }
    .filter-row input { flex:1.4; }
    .township-list {
      max-height:300px; overflow-y:auto; border:1px solid var(--hairline);
      border-radius:var(--radius-s); background:var(--bg-elev);
    }
    .township-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; border-bottom:1px solid var(--hairline);
      cursor:pointer; width:100%; border-left:none; border-right:none; border-top:none;
      background:transparent; text-align:left; transition:background .12s;
    }
    .township-row:hover, .township-row.active { background:var(--bg-elev-2); }
    .township-info { display:flex; align-items:center; gap:8px; }
    .township-info .sw { width:10px; height:10px; border-radius:3px; }
    .township-name { font-size:13.5px; font-weight:600; color:var(--text); }
    .township-county { font-size:11.5px; color:var(--text-faint); margin-left:4px; }
    .township-count { font-size:13.5px; font-weight:700; color:var(--text-dim); }

    /* ---------- Detail panel ---------- */
    .detail {
      background:var(--bg-elev); border:1px solid var(--hairline);
      box-shadow:var(--shadow-card); border-radius:var(--radius-l); padding:var(--sp-5);
    }
    .detail .empty { color:var(--text-faint); font-size:14px; text-align:center; padding:var(--sp-3) 0; }
    .detail-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); }
    .detail-head h3 { font-size:19px; margin:0; font-weight:700; }
    .detail-head .sub { font-size:13px; color:var(--text-faint); font-weight:normal; }
    .detail-tag { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; color:#1a0e05; }
    .detail .count-row { display:flex; align-items:baseline; gap:8px; margin-top:var(--sp-3); }
    .detail .count-row .v { font-size:32px; font-weight:700; }
    .detail .count-row .u { font-size:13px; color:var(--text-faint); }
    .detail .bar-track { margin-top:var(--sp-3); height:8px; border-radius:999px; background:var(--bg-elev-2); overflow:hidden; }
    .detail .bar-fill { height:100%; border-radius:999px; transition:width .4s ease; }
    .detail .bar-caption { margin-top:6px; font-size:11.5px; color:var(--text-faint); }

    /* ---------- CTA ---------- */
    .cta { display:flex; flex-direction:column; gap:var(--sp-3); }
    .btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      border-radius:var(--radius-s); padding:15px; font-size:15px; font-weight:700;
      cursor:pointer; min-height:48px; border:1px solid transparent; text-decoration:none;
    }
    .btn-primary { background:var(--accent-grad); color:#1a0e05; box-shadow:0 10px 22px -10px #ff6a3d80; }
    .btn-ghost { background:var(--bg-elev); border-color:var(--border-strong); color:var(--text-dim); }
    .foot-note { text-align:center; font-size:11.5px; color:var(--text-faint); line-height:1.6; }
  </style>
</head>

  function levelOf(n){

    if(n < 500) return 1;

    if(!key) return '';

    return y + ' 年 ' + m + ' 月';

  // 計算並取得某縣市整體運動量
  function getCountyTotal(counts, countyName){
    var sum = 0;
    var prefix = countyName + '/';
    Object.keys(counts).forEach(function(k){
      if(k.indexOf(prefix) === 0){
        sum += (counts[k] || 0);
      }
    });
    return sum;

  function render(period){
    var d;
    if(period === 'custom'){
      var key = monthInput.value;
      d = MONTHS[key] ? { label: formatMonthLabel(key), counts: MONTHS[key] } : { label: formatMonthLabel(key) + '（尚無資料）', counts: {} };
    } else {
      d = DATA[period];
    }
    current = d;

    // 計算 368 鄉鎮區統計
    var litTownships = 0;
    var totalVisits = 0;
    var topTownship = null;
    var topCount = -1;

    Object.keys(d.counts).forEach(function(k){
      var v = d.counts[k];
      totalVisits += v;
      if(v > 0) litTownships++;
      if(v > topCount){
        topCount = v;
        topTownship = k;
      }
    });

    // 更新頂部卡片
    document.getElementById('statLit').textContent = litTownships + ' / 368';
    document.getElementById('statVisits').textContent = fmt(totalVisits);
    document.getElementById('statTop').textContent = topTownship ? topTownship.split('/')[1] : '–';
    document.getElementById('statusText').textContent = d.label + ' 已點亮 ' + litTownships + ' / 368 個鄉鎮市區';

    // 著色縣市地圖
    mainCounties.forEach(function(c){
      var countySum = getCountyTotal(d.counts, c.n);
      var lv = levelOf(countySum);
      pathEls[c.n].setAttribute('fill', LEVELS[lv].hex);
    });

    offshoreCounties.forEach(function(c){
      var countySum = getCountyTotal(d.counts, c.n);
      var lv = levelOf(countySum);
      var chip = offshoreCounties._els[c.n];
      chip.querySelector('.dot').style.background = LEVELS[lv].hex;
      chip.querySelector('.num').textContent = fmt(countySum);
    });

    renderTownshipList();

    if(selectedTownship){
      updateTownshipDetail(selectedTownship);
    } else if(selectedCounty){
      updateCountyDetail(selectedCounty);
    } else if(topTownship){
      updateTownshipDetail(topTownship);
    }
  }

  // 渲染鄉鎮列表
  function renderTownshipList(){
    var listEl = document.getElementById('townshipList');
    var selectedFilter = countyFilter.value;
    var searchKeyword = document.getElementById('townshipSearch').value.trim();

    listEl.innerHTML = '';
    var items = [];

    Object.keys(TAIWAN_DISTRICTS).forEach(function(cName){
      if(selectedFilter !== 'ALL' && selectedFilter !== cName) return;
      TAIWAN_DISTRICTS[cName].forEach(function(tName){
        if(searchKeyword && tName.indexOf(searchKeyword) === -1 && cName.indexOf(searchKeyword) === -1){
          return;
        }
        var fullKey = cName + '/' + tName;
        var count = (current && current.counts[fullKey]) || 0;
        items.push({ fullKey: fullKey, county: cName, name: tName, count: count });
      });
    });

    // 依運動次數由大到小排序
    items.sort(function(a,b){ return b.count - a.count; });
    document.getElementById('filteredCount').textContent = '共 ' + items.length + ' 區';

    items.forEach(function(item){
      var lv = levelOf(item.count);
      var row = document.createElement('button');
      row.className = 'township-row' + (selectedTownship === item.fullKey ? ' active' : '');
      row.type = 'button';
      row.innerHTML =
        '<div class="township-info">' +
          '<span class="sw" style="background:'+LEVELS[lv].hex+'"></span>' +
          '<span class="township-name">' + item.name + '</span>' +
          '<span class="township-county">' + item.county + '</span>' +
        '</div>' +
        '<span class="township-count num">' + fmt(item.count) + ' 次</span>';

      row.addEventListener('click', function(){
        selectTownship(item.fullKey);
      });
      listEl.appendChild(row);
    });
  }

  function selectCounty(name){
    selectedCounty = name;
    selectedTownship = null;
    countyFilter.value = name;

    Object.keys(pathEls).forEach(function(n){
      pathEls[n].classList.toggle('selected', n === name);
    });
    if(pathEls[name]){ svg.appendChild(pathEls[name]); }
    svg.appendChild(mapLabel);
    showMapLabel(name);

    renderTownshipList();
    updateCountyDetail(name);
  }

  function selectTownship(fullKey){
    selectedTownship = fullKey;
    var parts = fullKey.split('/');
    selectedCounty = parts[0];
    countyFilter.value = selectedCounty;

    Object.keys(pathEls).forEach(function(n){
      pathEls[n].classList.toggle('selected', n === selectedCounty);
    });
    showMapLabel(selectedCounty);

    renderTownshipList();
    updateTownshipDetail(fullKey);
  }

  function updateCountyDetail(countyName){
    var detail = document.getElementById('detail');
    var sum = getCountyTotal(current.counts, countyName);
    var lv = levelOf(sum);

    detail.innerHTML =
      '<div class="detail-head">' +
        '<div><h3>' + countyName + '</h3><span class="sub">全縣市各鄉鎮總合</span></div>' +
        '<span class="detail-tag" style="background:'+LEVELS[lv].hex+'">'+LEVELS[lv].label+'</span>' +
      '</div>' +
      '<div class="count-row"><span class="v num">'+fmt(sum)+'</span><span class="u">次運動紀錄・' + current.label + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:100%; background:'+LEVELS[lv].hex+'"></div></div>' +
      '<p class="bar-caption">可於下方鄉鎮清單點選特定行政區深入查看。</p>';
  }

  function updateTownshipDetail(fullKey){
    var detail = document.getElementById('detail');
    var parts = fullKey.split('/');
    var cName = parts[0], tName = parts[1];
    var v = (current.counts[fullKey]) || 0;
    var lv = levelOf(v);

    var max = 1;
    Object.keys(current.counts).forEach(function(k){
      if(current.counts[k] > max) max = current.counts[k];
    });
    var pct = Math.max(4, Math.round((v / max) * 100));

    detail.innerHTML =
      '<div class="detail-head">' +
        '<div><h3>' + tName + '</h3><span class="sub">' + cName + '</span></div>' +
        '<span class="detail-tag" style="background:'+LEVELS[lv].hex+'">'+LEVELS[lv].label+'</span>' +
      '</div>' +
      '<div class="count-row"><span class="v num">'+fmt(v)+'</span><span class="u">次運動紀錄・' + current.label + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+LEVELS[lv].hex+'"></div></div>' +
      '<p class="bar-caption">相對於全台最活躍鄉鎮區（' + pct + '%）的運動比率</p>';
  }

  // 事件綁定
  var tabs = document.getElementById('periodTabs');
  var customPicker = document.getElementById('customPicker');
  var monthInput = document.getElementById('monthInput');

  if(MONTH_KEYS.length){
    monthInput.min = MONTH_KEYS[0];
    monthInput.max = LATEST_MONTH;
    monthInput.value = LATEST_MONTH;
  }

  tabs.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    Array.from(tabs.children).forEach(function(c){ c.setAttribute('aria-selected', String(c===btn)); });
    var period = btn.getAttribute('data-period');
    customPicker.hidden = period !== 'custom';
    render(period);
  });

  countyFilter.addEventListener('change', function(){
    if(this.value !== 'ALL'){
      selectCounty(this.value);
    } else {
      selectedCounty = null;
      selectedTownship = null;
      Object.keys(pathEls).forEach(function(n){ pathEls[n].classList.remove('selected'); });
      mapLabel.style.display = 'none';
      renderTownshipList();
    }
  });

  document.getElementById('townshipSearch').addEventListener('input', renderTownshipList);
  monthInput.addEventListener('change', function(){ render('custom'); });

  // 初次執行渲染上月資料
  render('prev');
})();
</script>
</body>
</html>
