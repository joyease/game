<!DOCTYPE html>
<html>
<head>
    <title>Visited Countries Globe</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <style>
        body { background: black; text-align: center; margin-top: 20px; }
        #worldmap { margin: 0 auto; }
        #worldmap svg { background: rgba(50,167,224,0.4); border-radius: 200px; box-shadow: 0 0 10px rgba(0,0,0,0.4); }
        .land { fill: rgba(188,188,188,0.94); }
        .visited { fill: gold; }
        #info { color: white; font-family: Arial; }
    </style>
</head>
<body>
    <div id="worldmap"></div>
    <p id="info">拖曳旋轉地球，黃色為去過國家</p>

    <script>
        const width = 400, height = 400;
        const projection = d3.geoOrthographic()
            .scale(200)
            .translate([width / 2, height / 2])
            .clipAngle(90);

        const path = d3.geoPath().projection(projection);
        const svg = d3.select("#worldmap").append("svg")
            .attr("width", width)
            .attr("height", height);

        // 你的去過國家ISO A3碼陣列（可從ISO列表擴充）
        const visited = ['TWN', 'JPN', 'USA', 'CAN'];  // 示例：台灣、日本、美國、加拿大

        // 載入世界地圖資料
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
            const land = topojson.feature(world, world.objects.countries);
            svg.append("path")
                .datum({type: "Sphere"})
                .attr("class", "ocean")
                .attr("d", path)
                .attr("fill", "#0a0c10");

            svg.selectAll(".land")
                .data(land.features)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path)
                .attr("id", d => d.properties.iso_a3)  // 用ISO碼當ID
                .classed("visited", d => visited.includes(d.properties.iso_a3));  // 高亮去過國家
        });

        // 滑鼠互動旋轉
        const λ = d3.scaleLinear().domain([0, width]).range([-180, 180]);
        const φ = d3.scaleLinear().domain([0, height]).range([90, -90]);

        svg.call(
            d3.drag()
                .on("drag", () => {
                    projection.rotate([λ(d3.event.x), φ(d3.event.y)]);
                    svg.selectAll("*").attr("d", path);
                })
        );
    </script>
</body>
</html>
