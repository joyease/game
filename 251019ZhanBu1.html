<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>易經占卜 - 取卦</title>
  <style>
    body {
      font-family: "Noto Serif TC", serif;
      background-color: #faf8f2;
      text-align: center;
      padding-top: 60px;
      color: #333;
    }
    input {
      font-size: 18px;
      width: 200px;
      margin: 10px;
      padding: 6px;
    }
    button {
      font-size: 18px;
      padding: 8px 16px;
      margin-top: 20px;
      cursor: pointer;
    }
    #time {
      margin-bottom: 30px;
      font-size: 20px;
      color: #555;
    }
  </style>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzAJ2DpZPTuUvwxyCQHn18BW5CY5JBNGU2dvm8QGfq80eGWm3vPP3W_tCUXRQDdMHydlg/exec"; // 改成你自己的 Web App URL

function submitNumbers() {
  const topic = document.getElementById("topic").value.trim();
  const guaNum = parseInt(document.getElementById("guaNum").value);
  const yaoNum = parseInt(document.getElementById("yaoNum").value);

  if (!topic) return alert("請輸入主題。");
  if (isNaN(guaNum) || guaNum < 100 || guaNum > 999) return alert("取卦數字需為 100~999");
  if (isNaN(yaoNum) || yaoNum < 100 || yaoNum > 999) return alert("取爻數字需為 100~999");

  const payload = { topic, guaNum, yaoNum };

  fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(`${data.message}\n卦名：${data.guaName}\n爻名：${data.yaoName}`);
    } else {
      alert("寫入失敗：" + data.message);
    }
  })
  .catch(err => alert("連線錯誤：" + err.message));
}
</script>

</head>
<body>
  <h1>易經占卜</h1>
  <div id="time"></div>

  <label>主題：</label>
  <input type="text" id="topic" placeholder="請輸入占卜主題"><br>

  <label>取卦數字：</label>
  <input type="number" id="guaNum" min="100" max="999"><br>

  <label>取爻數字：</label>
  <input type="number" id="yaoNum" min="100" max="999"><br>

  <button onclick="submitNumbers()">記錄</button>
  <p style="margin-top:40px;">記錄後可前往 <a href="view.html" target="_blank">查看卦辭與爻辭</a></p>
</body>
</html>
