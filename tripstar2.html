<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Spline+Sans%3Awght%40400%3B500%3B700"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>運動旅遊</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #ea2a33;
      }
    </style>
    <title>GPS 地圖標記展示</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
      body {
        font-family: "Noto Sans TC", Arial, sans-serif;
        min-height: max(840px, 85dvh);
      }
      #map {
        width: 100%;
        height: 800px; /* 固定高度 */
        max-height: 80vh; /* 避免太高 */
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      @media (max-width: 768px) {
        #map {
          height: 50vh; /* 手機時縮小一點 */
        }
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div
      class="relative flex size-full min-h-screen flex-col justify-between group/design-root"
      style='font-family: "Spline Sans", "Noto Sans", sans-serif;'
    >
      <div class="flex-grow">
        <div class="relative">
          <div
            class="w-full bg-center bg-no-repeat bg-cover h-96"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA1POCYBRcDDXZmXAR8ld4HTQxhyJJjmKXsIpICqNJQttQpChNs70cjSTcUvCh8gcSf-AFB-jtUUH_UjiPz0nU0eJqIVc-9LtotSqhLNRWePDyhDBT8wfJp1B_9HPQ32aGY7t6ylQeMHWbBOFYE2D3633VtCc3zuvdOwOVkY6DbDDK4o1ydudv4Z3mzMhGRve_3qnnnE54WCufGYqn0Rz_Bzo00_i1uA8qpiaJT-ZsHblXlWNlWfZVaDGDqdqawP-nP4E1WF209X4z9");'
          >
            <div class="absolute inset-0 bg-black/20"></div>
          </div>
          <div class="absolute inset-x-0 bottom-0 px-4 pb-6">
            <h1 class="text-4xl font-bold text-white mb-2"> Trip 位置共享</h1>
            <p class="text-lg text-white/90">旅行中看到彼此的位置</p>
            <div class="mt-4">
              <label class="flex flex-col min-w-40 w-full">
                <div class="flex w-full flex-1 items-stretch rounded-full shadow-lg h-14">
                  <div class="text-gray-500 flex bg-white items-center justify-center pl-5 rounded-l-full">
                    <span class="material-symbols-outlined"> search </span>
                  </div>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-full text-gray-800 focus:outline-0 focus:ring-0 border-none bg-white focus:border-none h-full placeholder:text-gray-500 px-4 text-base font-normal leading-normal"
                    placeholder="搜尋目的地或活動"
                    value=""
                  />
                </div>
              </label>
            </div>
          </div>
        </div>

        <h2 class="mt-6 text-xl font-bold px-4">Trip 位置共享</h2>
        <p class="px-4">登山遠行, 團體出遊, 彼此看到彼此的位置，互相關心安全!</p>
        <p class="px-4 mb-2">說好代碼, 回報位置, 輸入查詢! 請輸入 H09 看示範</p>
        <form id="filterForm" class="px-4 mb-4">
          <label for="teamInput">輸入代碼：</label>
          <input type="text" id="teamInput" required class="border p-1 rounded">
          <button type="submit" class="ml-2 px-3 py-1 bg-red-500 text-white rounded">查詢</button>
        </form>

        <div id="map"></div>

        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script>
          // 初始化地圖
          const map = L.map('map').setView([24, 121], 7);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);

          map.whenReady(() => {
            map.invalidateSize();
          });

          // 深色顏色池
          const deepColors = [
            '#8B0000', '#00008B', '#006400', '#4B0082', '#2F4F4F',
            '#800000', '#191970', '#483D8B', '#2E0854', '#0B3D91'
          ];
          const nameColorMap = {};
          function getDeepColorForName(name) {
            if (!nameColorMap[name]) {
              let hash = 0;
              for (let i = 0; i < name.length; i++) {
                hash += name.charCodeAt(i);
              }
              nameColorMap[name] = deepColors[hash % deepColors.length];
            }
            return nameColorMap[name];
          }

          // 標記圖層
          let markersLayer = L.layerGroup().addTo(map);

          // 載入 GPS 資料
          let allData = [];
          async function loadGPSData() {
            const url = 'https://opensheet.elk.sh/18Ol8kRgvdd6Do91s17CT-w32ds2n3zdN7cf6bDn9a38/位置記錄';
            try {
              const res = await fetch(url);
              allData = await res.json();
            } catch (e) {
              alert('資料載入失敗，請查看 console。');
              console.error(e);
            }
          }

          // 顯示標記
          function showTeamMarkers(teamCode) {
            markersLayer.clearLayers();
            const filtered = allData.filter(row => row['團隊編號'] === teamCode);
            const latestByName = {};
            filtered.forEach(row => {
              const name = row['姓名'];
              if (!latestByName[name] || row['時間'] > latestByName[name]['時間']) {
                latestByName[name] = row;
              }
            });

            Object.values(latestByName).forEach(row => {
              const name = row['姓名'];
              const lat = parseFloat(row['緯度']);
              const lng = parseFloat(row['經度']);
              const uuid = row['UUID'];
              const time = row['時間'];
              if (isNaN(lat) || isNaN(lng)) return;

              const color = getDeepColorForName(name);
              const marker = L.circleMarker([lat, lng], {
                radius: 5,
                color: color,
                fillColor: color,
                fillOpacity: 0.8
              });
              marker.bindPopup(`<b>${name || ''}</b><br>UUID: ${uuid || ''}<br>時間: ${time || ''}`);
              marker.addTo(markersLayer);
            });

            const points = Object.values(latestByName).map(row => [parseFloat(row['緯度']), parseFloat(row['經度'])]);
            if (points.length > 0) {
              map.fitBounds(points, { maxZoom: 18 });
            }
          }

          // 表單事件
          document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const teamCode = document.getElementById('teamInput').value.trim();
            if (!teamCode) return;
            showTeamMarkers(teamCode);
          });

          // 載入資料
          loadGPSData();
        </script>
      </div>

      <div class="sticky bottom-0">
        <div class="flex gap-2 border-t border-gray-200 bg-white px-4 pb-3 pt-2 shadow-t-lg">
          <a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[var(--primary-color)]" href="https://sportrip7.wordpress.com">
            <span class="material-symbols-outlined"> explore </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">SporTrip創新探索</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="https://www.mysports.net.tw">
            <span class="material-symbols-outlined"> favorite </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">MySports社群網站</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="http://aitrip.idv.tw">
            <span class="material-symbols-outlined">home</span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">首頁</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="#">
            <span class="material-symbols-outlined"> inbox </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">聯絡信箱</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="#">
            <span class="material-symbols-outlined"> account_circle </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">Hermann Huang</p>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
