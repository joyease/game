<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>體重變化曲線圖（最近10筆，點上顯示日期與詳細資料）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body>
  <h2>體重變化曲線圖（最近10筆，點上顯示日期與詳細資料）</h2>
  <canvas id="weightChart" width="800" height="400"></canvas>

  <script>
    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbzAJV4rS5M-4eXJOpkQ2nwjLIo0i70Tn5gCGVuEo-hW_52-2ZRIAACToNyiwIq5UOo/exec');
      const data = await response.json();
      return data;
    }

    async function createChart() {
      let data = await fetchData();

      if (data.length > 10) {
        data = data.slice(data.length - 10);
      }

      const labels = Array.from({length: data.length}, (_, i) => i + 1);
      const datasetData = data.map(item => ({
        y: item.weight,
        date: item.date,
        sleep: item.sleep,
        steps: item.steps,
        calories: item.calories,
        water: item.water
      }));

      const ctx = document.getElementById('weightChart').getContext('2d');

      Chart.register(window['ChartDataLabels']); // 註冊plugin

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '體重 (kg)',
            data: datasetData,
            borderColor: 'rgba(75,192,192,1)',
            backgroundColor: 'rgba(75,192,192,0.2)',
            fill: true,
            tension: 0.2,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          plugins: {
            datalabels: {
              align: 'top',
              formatter: function(value) {
                return value.date; // 顯示日期
              },
              font: {
                weight: 'bold'
              },
              color: '#666',
              offset: 6
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const d = context.dataset.data[context.dataIndex];
                  return [
                    `體重: ${d.y} kg`,
                    `睡眠: ${d.sleep} 小時`,
                    `步數: ${d.steps}`,
                    `卡路里: ${d.calories} Kcal`,
                    `飲水: ${d.water} 杯`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: '筆數'
              }
            },
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: '體重(kg)'
              }
            }
          },
          interaction: {
            mode: 'nearest',
            intersect: true
          }
        },
        plugins: [ChartDataLabels] // 啟用插件
      });
    }

    createChart();
  </script>
</body>
</html>
