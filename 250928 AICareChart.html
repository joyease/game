<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>體重變化曲線圖</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>體重變化曲線圖（最近10筆）</h2>
  <canvas id="weightChart" width="800" height="400"></canvas>

  <script>
    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbzAJV4rS5M-4eXJOpkQ2nwjLIo0i70Tn5gCGVuEo-hW_52-2ZRIAACToNyiwIq5UOo/exec');
      const data = await response.json();
      return data;
    }

    async function createChart() {
      let data = await fetchData();

      // 取得最後10筆
      if (data.length > 10) {
        data = data.slice(data.length - 10);
      }

      // X軸標籤 1~10
      const labels = Array.from({length: data.length}, (_, i) => i + 1);
      const weights = data.map(item => item.weight);

      const ctx = document.getElementById('weightChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '體重 (kg)',
            data: weights,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          scales: {
            x: {
              title: {
                display: true,
                text: '筆數'
              }
            },
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: '體重(kg)'
              }
            }
          }
        }
      });
    }

    createChart();
  </script>
</body>
</html>
