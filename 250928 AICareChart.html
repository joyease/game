<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>體重變化曲線圖</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2"></script>
</head>
<body>
  <h2>體重變化曲線圖</h2>
  <canvas id="weightChart" width="800" height="400"></canvas>

  <script>
    Chart.register(window['chartjs-adapter-date-fns']);

    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbzAJV4rS5M-4eXJOpkQ2nwjLIo0i70Tn5gCGVuEo-hW_52-2ZRIAACToNyiwIq5UOo/exec');
      const data = await response.json();
      return data;
    }

    async function createChart() {
      const data = await fetchData();

      const chartData = data.map(item => {
        const date = new Date(item.date);
        if (isNaN(date)) {
          console.warn('日期格式有問題:', item.date);
        }
        return { x: date, y: item.weight };
      });

      const ctx = document.getElementById('weightChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: '體重 (kg)',
            data: chartData,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          scales: {
            x: {
              type: 'time',
              time: { unit: 'day' },
              title: { display: true, text: '日期時間' }
            },
            y: {
              beginAtZero: false,
              title: { display: true, text: '體重(kg)' }
            }
          }
        }
      });
    }

    createChart();
  </script>
</body>
</html>
