<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>體重變化曲線圖（最近15筆）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>體重變化曲線圖（最近15筆）</h2>
  <canvas id="weightChart" width="800" height="400"></canvas>

  <script>
    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbzAJV4rS5M-4eXJOpkQ2nwjLIo0i70Tn5gCGVuEo-hW_52-2ZRIAACToNyiwIq5UOo/exec');
      const data = await response.json();
      return data;
    }

    async function createChart() {
      let data = await fetchData();

      // 取最後15筆
      if (data.length > 15) {
        data = data.slice(data.length - 15);
      }

      const labels = Array.from({length: data.length}, (_, i) => i + 1);

      // 改成物件陣列，包含更多欄位給tooltip用
      const datasetData = data.map(item => ({
        y: item.weight,
        sleep: item.sleep,
        steps: item.steps,
        calories: item.calories,
        water: item.water
      }));

      const ctx = document.getElementById('weightChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '體重 (kg)',
            data: datasetData,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            fill: true,
            tension: 0.2,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          scales: {
            x: {
              title: {
                display: true,
                text: '筆數'
              }
            },
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: '體重(kg)'
              }
            }
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  const d = context.dataset.data[context.dataIndex];
                  return [
                    `體重: ${d.y} kg`,
                    `睡眠: ${d.sleep} 小時`,
                    `步數: ${d.steps}`,
                    `卡路里: ${d.calories} Kcal`,
                    `飲水: ${d.water} 杯`
                  ];
                }
              }
            }
          },
          interaction: {
            mode: 'nearest',
            intersect: true
          }
        }
      });
    }

    createChart();
  </script>
</body>
</html>
