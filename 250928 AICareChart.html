<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>體重變化曲線圖（最近15筆，點擊顯示完整資料）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>體重變化曲線圖（最近15筆）</h2>
  <canvas id="weightChart" width="900" height="450"></canvas>

  <script>
    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbzAJV4rS5M-4eXJOpkQ2nwjLIo0i70Tn5gCGVuEo-hW_52-2ZRIAACToNyiwIq5UOo/exec');
      const data = await response.json();
      return data;
    }

    async function createChart() {
      let data = await fetchData();

      // 取最新15筆資料
      if (data.length > 15) {
        data = data.slice(data.length - 15);
      }

      // X軸標籤 1~15
      const labels = Array.from({length: data.length}, (_, i) => i + 1);

      // 用物件形式，組成資料集時傳入額外欄位作為tooltip顯示內容用
      const chartData = data.map(item => ({
        x: null, // 用labels做X軸，不需單獨設定x
        y: item.weight,
        fullData: item    // 把完整item資料綁定在該點上
      }));

      const ctx = document.getElementById('weightChart').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '體重 (kg)',
            data: chartData,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            fill: true,
            tension: 0.2,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          interaction: {
            mode: 'nearest',
            intersect: true
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  // 取出綁定的完整資料
                  const item = context.dataset.data[context.dataIndex].fullData;
                  return [
                    `日期: ${item.date}`,
                    `體重: ${item.weight} kg`,
                    `睡眠: ${item.sleep} 小時`,
                    `步數: ${item.steps}`,
                    `熱量: ${item.calories} Kcal`,
                    `飲水: ${item.water} 杯`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: '筆數'
              }
            },
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: '體重(kg)'
              }
            }
          }
        }
      });
    }

    createChart();
  </script>
</body>
</html>
