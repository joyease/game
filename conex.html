<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脈智慧存摺 (低流量版)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --ink: #1a1a2e; --ink-muted: #5a5a72; --surface: #f5f4f0; --card: #ffffff; --accent: #3b5bdb; --accent-soft: #eef2ff; --border: #e2e1de; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--surface); color: var(--ink); min-height: 100vh; }
        .hidden { display: none !important; }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .content { display: grid; grid-template-columns: 320px 1fr; max-width: 1300px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; }
        .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: sticky; top: 80px; }
        .form-section-label { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 0.6rem; display: block; }
        .form-input { width: 100%; border: none; border-bottom: 1.5px solid var(--border); padding: 0.5rem 0; font-size: 0.88rem; margin-bottom: 1rem; outline: none; background: transparent; }
        .form-textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.7rem; font-size: 0.85rem; min-height: 80px; outline: none; margin-bottom: 1rem; }
        .btn-save { width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 0.8rem; font-weight: 700; cursor: pointer; }
        .search-row { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; outline: none; }
        .btn-search { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 0 1.25rem; cursor: pointer; }
        #contactList { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .contact-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
        .card-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
        .card-company { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 0.75rem; }
        .card-context { font-size: 0.8rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 0.3rem 0.6rem; border-radius: 6px; display: inline-block; margin-bottom: 0.75rem; }
        .card-meta { font-size: 0.75rem; color: var(--ink-muted); margin-bottom: 0.75rem; line-height: 1.5; }
        .card-notes { background: var(--surface); border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.8rem; line-height: 1.6; }
        .card-tag { font-size: 0.65rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 10px; background: #eee; margin-right: 4px; }
        .stats-text { margin-bottom: 1rem; color: var(--ink-muted); font-weight: 700; }
        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } .form-card { position: static; } }
    </style>
</head>
<body>

<div id="authSection">
    <div class="auth-card" style="background:#fff; padding:2rem; border-radius:20px; border:1px solid #ddd; max-width:400px; margin: 100px auto; text-align:center;">
        <h2 style="margin-bottom:1.5rem">人脈智慧存摺</h2>
        <input type="email" id="loginEmail" placeholder="電子郵件" style="width:100%; padding:0.8rem; margin-bottom:1rem; border:1px solid #ddd; border-radius:10px;">
        <input type="password" id="loginPassword" placeholder="密碼" style="width:100%; padding:0.8rem; margin-bottom:1rem; border:1px solid #ddd; border-radius:10px;">
        <button onclick="handleLogin()" style="width:100%; background:var(--accent); color:#fff; border:none; padding:0.9rem; border-radius:10px; font-weight:700; cursor:pointer;">登入</button>
    </div>
</div>

<div id="mainSection" class="hidden">
    <header class="topbar">
        <div style="font-weight:900; font-size:1.5rem">CONEX<span>.</span></div>
        <div style="display:flex; align-items:center; gap:1rem">
            <span id="userWelcome" style="font-size:0.8rem"></span>
            <button onclick="handleLogout()" style="cursor:pointer; border:1px solid #ddd; padding:2px 8px; border-radius:5px">登出</button>
        </div>
    </header>

    <div class="content">
        <aside class="sidebar">
            <div class="form-card">
                <span class="form-section-label">新增聯絡人</span>
                <input type="text" id="name" class="form-input" placeholder="全名（必填）">
                <input type="text" id="company" class="form-input" placeholder="公司 / 單位">
                
                <span class="form-section-label">分類標籤</span>
                <input type="text" id="tags" class="form-input" placeholder="例：投資, 顧問">

                <span class="form-section-label">背景資訊 (Context)</span>
                <input type="text" id="context" class="form-input" placeholder="例：讀書會、某次餐敘">
                
                <span class="form-section-label">聯絡方式</span>
                <input type="tel" id="phone" class="form-input" placeholder="電話">
                <input type="email" id="email" class="form-input" placeholder="信箱">
                
                <span class="form-section-label">記憶點 / 備註</span>
                <textarea id="notes" class="form-textarea" placeholder="想記下的細節..."></textarea>
                
                <button class="btn-save" onclick="saveData()" id="saveBtn">儲存資料</button>
            </div>
        </aside>

        <section class="panel">
            <div id="statsDisplay" class="stats-text">正在讀取統計資料...</div>
            <div class="search-row">
                <div class="search-wrap">
                    <input type="text" id="searchKeyword" placeholder="搜尋姓名、標籤、背景或備註" onkeydown="if(event.key==='Enter') doSearch()">
                </div>
                <button class="btn-search" onclick="doSearch()" id="searchBtn">開始查詢</button>
            </div>
            <div id="contactList"></div>
        </section>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4xA4cDFClv0a4rdDKA_VYJ7I1sA8IuU",
        authDomain: "conex-643f8.firebaseapp.com",
        projectId: "conex-643f8",
        storageBucket: "conex-643f8.firebasestorage.app",
        messagingSenderId: "359604292502",
        appId: "1:359604292502:web:2444845f9a4d49ba6d6bb7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('userWelcome').innerText = user.email;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadTotalCount();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
    });

    async function loadTotalCount() {
        try {
            const snapshot = await getCountFromServer(collection(db, 'contacts'));
            document.getElementById('statsDisplay').innerText = `📊 目前存摺共有 ${snapshot.data().count} 位聯絡人`;
        } catch (e) { console.error(e); }
    }

    window.saveData = async () => {
        const name = document.getElementById('name').value.trim();
        const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
        if (!name) return alert('請輸入姓名');
        
        try {
            await addDoc(collection(db, 'contacts'), {
                name,
                company: document.getElementById('company').value.trim(),
                tags,
                context: document.getElementById('context').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                notes: document.getElementById('notes').value.trim(),
                createdAt: new Date()
            });
            alert('儲存成功');
            ['name','company','tags','context','phone','email','notes'].forEach(id => document.getElementById(id).value = '');
            loadTotalCount();
        } catch (e) { alert('儲存失敗'); }
    };

    window.doSearch = async () => {
        const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
        const list = document.getElementById('contactList');
        const btn = document.getElementById('searchBtn');

        list.innerHTML = '<p style="color:gray; padding:2rem;">連線雲端中...</p>';
        btn.disabled = true;

        try {
            const snap = await getDocs(collection(db, 'contacts'));
            let results = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            if (keyword) {
                results = results.filter(c => {
                    const tagString = (c.tags || []).join(' ');
                    return [c.name, c.company, c.notes, c.context, tagString].join(' ').toLowerCase().includes(keyword);
                });
            }

            // 依照時間排序 (最新在前面)
            results.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            renderCards(results);
            document.getElementById('statsDisplay').innerText = `🔎 搜尋結果：共 ${results.length} 位聯絡人`;
        } catch (e) { alert('抓取失敗'); }
        finally { btn.disabled = false; }
    };

    function renderCards(data) {
        const list = document.getElementById('contactList');
        list.innerHTML = data.length ? '' : '<p style="color:gray; padding:2rem;">找不到符合的資料</p>';
        data.forEach(item => {
            const tagHtml = (item.tags || []).map(t => `<span class="card-tag">#${t}</span>`).join('');
            list.innerHTML += `
                <div class="contact-card">
                    <div class="card-name">${item.name}</div>
                    <div class="card-company">${item.company || '個人'}</div>
                    ${item.context ? `<div class="card-context">📍 ${item.context}</div>` : ''}
                    <div class="card-meta">
                        ${item.phone ? `<div>📞 ${item.phone}</div>` : ''}
                        ${item.email ? `<div>✉️ ${item.email}</div>` : ''}
                    </div>
                    <div class="card-notes">${item.notes || ''}</div>
                    <div style="margin-top:10px">${tagHtml}</div>
                </div>`;
        });
    }

    window.handleLogin = async () => {
        const e = document.getElementById('loginEmail').value;
        const p = document.getElementById('loginPassword').value;
        try { await signInWithEmailAndPassword(auth, e, p); }
        catch (err) { try { await createUserWithEmailAndPassword(auth, e, p); } catch(x) { alert('登入失敗'); } }
    };
    window.handleLogout = () => signOut(auth);
</script>
</body>
</html>
