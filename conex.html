<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脈智慧存摺</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #1a1a2e;
            --ink-muted: #5a5a72;
            --ink-faint: #9898aa;
            --surface: #f5f4f0;
            --card: #ffffff;
            --accent: #3b5bdb;
            --accent-soft: #eef2ff;
            --accent-muted: #748ffc;
            --border: #e2e1de;
            --border-focus: #3b5bdb;
            --danger: #e03131;
            --tag-colors: #3b5bdb, #1098ad, #2f9e44, #e67700, #9c36b5;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ── Auth ── */
        #authSection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.07);
        }

        .auth-logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--ink);
            margin-bottom: 0.25rem;
        }
        .auth-logo span { color: var(--accent); }
        .auth-sub { color: var(--ink-faint); font-size: 0.85rem; margin-bottom: 2rem; }

        .field { position: relative; margin-bottom: 1rem; }
        .field input {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ink);
            background: #fafaf8;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--border-focus); background: #fff; }
        .field input::placeholder { color: var(--ink-faint); }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.9rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary:hover { background: #2f4bc7; }
        .btn-primary:active { transform: scale(0.98); }

        /* ── Main Layout ── */
        .hidden { display: none !important; }

        #mainSection { display: flex; flex-direction: column; min-height: 100vh; }

        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-right { display: flex; align-items: center; gap: 1rem; }
        #userWelcome { font-size: 0.8rem; color: var(--ink-faint); font-family: 'DM Mono', monospace; }

        .btn-logout {
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--danger);
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-logout:hover { background: #fff5f5; border-color: var(--danger); }

        /* ── Content ── */
        .content {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            flex: 1;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            gap: 2rem;
        }

        /* ── Sidebar Form ── */
        .sidebar {
            position: sticky;
            top: 76px;
            align-self: start;
        }

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .form-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: 1.25rem;
        }

        .form-section { margin-bottom: 1.25rem; }
        .form-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-muted);
            margin-bottom: 0.6rem;
            display: block;
        }

        .form-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid var(--border);
            padding: 0.5rem 0;
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--ink);
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0.5rem;
        }
        .form-input:focus { border-color: var(--accent); }
        .form-input::placeholder { color: var(--ink-faint); }

        .form-textarea {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--ink);
            background: #fafaf8;
            outline: none;
            resize: vertical;
            min-height: 90px;
            transition: border-color 0.2s;
        }
        .form-textarea:focus { border-color: var(--accent); background: #fff; }
        .form-textarea::placeholder { color: var(--ink-faint); }

        .btn-save {
            width: 100%;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .btn-save:hover { background: #000; }
        .btn-save:active { transform: scale(0.98); }

        /* ── Right Panel ── */
        .panel {}

        /* ── Tag Filter Bar ── */
        .tag-filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .tag-filter-btn {
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--ink-muted);
            border-radius: 20px;
            padding: 0.3rem 0.85rem;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tag-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tag-filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ── Search Bar ── */
        .search-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .search-wrap { position: relative; flex: 1; }
        .search-wrap input {
            width: 100%;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap input::placeholder { color: var(--ink-faint); }
        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-faint);
            font-size: 1rem;
            pointer-events: none;
        }

        .btn-search {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 1.25rem;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-search:hover { background: #2f4bc7; }

        /* ── Stats Row ── */
        .stats-row {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            margin-bottom: 1rem;
        }
        .stats-count {
            font-size: 0.78rem;
            color: var(--ink-faint);
            font-family: 'DM Mono', monospace;
        }

        /* ── Contact Grid ── */
        #contactList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* ── Contact Card ── */
        .contact-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            cursor: default;
        }
        .contact-card:hover {
            border-color: var(--accent-muted);
            box-shadow: 0 4px 20px rgba(59,91,219,0.1);
            transform: translateY(-2px);
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; gap: 0.5rem; }
        .card-name { font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
        .card-company { font-size: 0.75rem; color: var(--ink-faint); margin-top: 0.2rem; }

        .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: flex-end; max-width: 110px; }
        .card-tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .card-meta { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.75rem; }
        .card-meta-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--ink-muted); }
        .card-meta-row a { color: var(--accent); text-decoration: none; }
        .card-meta-row a:hover { text-decoration: underline; }
        .card-meta-icon { font-size: 0.8rem; flex-shrink: 0; }

        .card-notes {
            background: var(--surface);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            color: var(--ink-muted);
            line-height: 1.6;
            min-height: 42px;
        }
        .card-notes.empty { color: var(--ink-faint); font-style: italic; }

        /* ── Empty State ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--ink-faint);
        }
        .empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .empty-state-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--ink-muted); }
        .empty-state-sub { font-size: 0.82rem; }

        /* ── Spinner ── */
        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .content { grid-template-columns: 1fr; padding: 1rem; }
            .sidebar { position: static; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 0 1rem; }
            #userWelcome { display: none; }
        }
    </style>
</head>
<body>

<!-- 登入介面 -->
<div id="authSection">
    <div class="auth-card">
        <div class="auth-logo">人脈<span>.</span>存摺</div>
        <p class="auth-sub">請登入以同步您的雲端人脈資料</p>
        <div class="field"><input type="email" id="loginEmail" placeholder="電子郵件"></div>
        <div class="field"><input type="password" id="loginPassword" placeholder="密碼"></div>
        <button class="btn-primary" onclick="handleLogin()" id="loginBtn">
            <span>登入 &nbsp;/&nbsp; 自動註冊</span>
        </button>
    </div>
</div>

<!-- 主程式 -->
<div id="mainSection" class="hidden">
    <!-- 頂部列 -->
    <header class="topbar">
        <div class="topbar-logo">人脈<span>.</span>存摺</div>
        <div class="topbar-right">
            <span id="userWelcome"></span>
            <button class="btn-logout" onclick="handleLogout()">登出</button>
        </div>
    </header>

    <div class="content">
        <!-- 左側：新增表單 -->
        <aside class="sidebar">
            <div class="form-card">
                <div class="form-title">✦ 新增聯絡夥伴</div>

                <div class="form-section">
                    <span class="form-section-label">基本資料</span>
                    <input type="text" id="name" class="form-input" placeholder="全名（必填）">
                    <input type="text" id="company" class="form-input" placeholder="公司 / 職稱">
                </div>

                <div class="form-section">
                    <span class="form-section-label">聯絡方式</span>
                    <input type="tel" id="phone" class="form-input" placeholder="連絡電話">
                    <input type="email" id="email" class="form-input" placeholder="電子信箱">
                </div>

                <div class="form-section">
                    <span class="form-section-label">分類標籤</span>
                    <input type="text" id="tags" class="form-input" placeholder="例：投資, 登山, 潛在客戶">
                    <div style="font-size:0.7rem;color:var(--ink-faint);margin-top:0.2rem;">以逗號分隔，作為分類依據</div>
                </div>

                <div class="form-section">
                    <span class="form-section-label">相識背景</span>
                    <input type="text" id="meetingContext" class="form-input" placeholder="時間 / 地點（如：2026論壇）">
                </div>

                <div class="form-section">
                    <span class="form-section-label">記憶點備註</span>
                    <textarea id="notes" class="form-textarea" placeholder="聊過的重點、對方的興趣或特別記憶..."></textarea>
                </div>

                <button class="btn-save" onclick="saveData()" id="saveBtn">儲存並備份</button>
            </div>
        </aside>

        <!-- 右側：查詢與列表 -->
        <section class="panel">
            <!-- 搜尋列 -->
            <div class="search-row">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchKeyword" placeholder="輸入關鍵字查詢（姓名、公司、標籤、備註）"
                           onkeydown="if(event.key==='Enter') doSearch()">
                </div>
                <button class="btn-search" onclick="doSearch()">
                    <span>查詢</span>
                </button>
            </div>

            <!-- 標籤篩選列 -->
            <div class="tag-filter-bar" id="tagFilterBar">
                <button class="tag-filter-btn active" data-tag="__all__" onclick="handleTagFilter(this)">全部</button>
            </div>

            <!-- 統計 -->
            <div class="stats-row">
                <span class="stats-count" id="statsText"></span>
            </div>

            <!-- 聯絡人卡片 -->
            <div id="contactList"></div>
        </section>
    </div>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4xA4cDFClv0a4rdDKA_VYJ7I1sA8IuU",
        authDomain: "conex-643f8.firebaseapp.com",
        projectId: "conex-643f8",
        storageBucket: "conex-643f8.firebasestorage.app",
        messagingSenderId: "359604292502",
        appId: "1:359604292502:web:2444845f9a4d49ba6d6bb7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allContacts = [];
    let activeTag = '__all__';
    let activeKeyword = '';

    // ── Auth ──
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('userWelcome').innerText = user.email;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadInitialData();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
    });

    window.handleLogin = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        if (!email || !password) return alert('請填寫帳號與密碼');
        btn.innerHTML = '<span class="spinner"></span>';
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
            if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('已為您建立新帳號！');
                } catch (e) { alert('註冊失敗：' + e.message); }
            } else { alert('登入失敗：' + err.message); }
        }
        btn.innerHTML = '<span>登入 &nbsp;/&nbsp; 自動註冊</span>';
    };

    window.handleLogout = () => signOut(auth);

    // ── Save ──
    window.saveData = async () => {
        const name = document.getElementById('name').value.trim();
        const company = document.getElementById('company').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const tagsRaw = document.getElementById('tags').value;
        const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
        const context = document.getElementById('meetingContext').value.trim();
        const notes = document.getElementById('notes').value.trim();
        const btn = document.getElementById('saveBtn');

        if (!name) return alert('請輸入姓名');
        btn.innerHTML = '同步中...';

        try {
            await addDoc(collection(db, 'contacts'), {
                name, company, phone, email, tags, context, notes,
                uid: auth.currentUser.uid,
                createdAt: new Date()
            });
            // 清空表單
            ['name','company','phone','email','tags','meetingContext','notes'].forEach(id => {
                document.getElementById(id).value = '';
            });
            await loadInitialData();
        } catch (e) {
            alert('儲存失敗：' + e.message);
        } finally {
            btn.innerHTML = '儲存並備份';
        }
    };

    // ── Load ──
    async function loadInitialData() {
        const list = document.getElementById('contactList');
        list.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink-faint);">連線資料庫中...</div>';

        try {
            const q = query(
                collection(db, 'contacts'),
                where('uid', '==', auth.currentUser.uid),
                orderBy('createdAt', 'desc')
            );
            const snap = await getDocs(q);
            allContacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            buildTagFilter();
            applyFilter();
        } catch (e) {
            list.innerHTML = '<div style="color:var(--danger);padding:2rem;">讀取失敗，請確認資料庫權限</div>';
        }
    }

    // ── Tag Filter ──
    function buildTagFilter() {
        const bar = document.getElementById('tagFilterBar');
        // collect all unique tags
        const tagSet = new Set();
        allContacts.forEach(c => (c.tags || []).forEach(t => tagSet.add(t)));

        bar.innerHTML = '<button class="tag-filter-btn active" data-tag="__all__" onclick="handleTagFilter(this)">全部</button>';
        tagSet.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-filter-btn';
            btn.dataset.tag = tag;
            btn.textContent = `# ${tag}`;
            btn.setAttribute('onclick', 'handleTagFilter(this)');
            bar.appendChild(btn);
        });
    }

    window.handleTagFilter = (el) => {
        document.querySelectorAll('.tag-filter-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        activeTag = el.dataset.tag;
        applyFilter();
    };

    // ── Search ──
    window.doSearch = () => {
        activeKeyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
        applyFilter();
    };

    // ── Filter & Render ──
    function applyFilter() {
        let result = allContacts;

        // Tag filter
        if (activeTag !== '__all__') {
            result = result.filter(c => (c.tags || []).includes(activeTag));
        }

        // Keyword filter
        if (activeKeyword) {
            result = result.filter(c => {
                const blob = [c.name, c.company, c.phone, c.email, (c.tags || []).join(' '), c.context, c.notes]
                    .join(' ').toLowerCase();
                return blob.includes(activeKeyword);
            });
        }

        renderCards(result);

        const total = allContacts.length;
        const shown = result.length;
        document.getElementById('statsText').textContent =
            shown === total ? `共 ${total} 位聯絡人` : `篩選結果：${shown} / ${total} 位`;
    }

    function renderCards(data) {
        const list = document.getElementById('contactList');
        list.innerHTML = '';

        if (!data.length) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🗂</div>
                    <div class="empty-state-title">找不到符合條件的聯絡人</div>
                    <div class="empty-state-sub">試試調整關鍵字或篩選標籤</div>
                </div>`;
            return;
        }

        data.forEach(item => {
            const tags = (item.tags || []).map(t =>
                `<span class="card-tag">#${t}</span>`).join('');

            const phone = item.phone
                ? `<div class="card-meta-row"><span class="card-meta-icon">📞</span><a href="tel:${item.phone}">${item.phone}</a></div>`
                : '';
            const email = item.email
                ? `<div class="card-meta-row"><span class="card-meta-icon">✉️</span><a href="mailto:${item.email}">${item.email}</a></div>`
                : '';
            const ctx = item.context
                ? `<div class="card-meta-row"><span class="card-meta-icon">📍</span><span>${item.context}</span></div>`
                : '';

            const hasNotes = item.notes && item.notes.trim();

            list.innerHTML += `
                <div class="contact-card">
                    <div class="card-header">
                        <div>
                            <div class="card-name">${item.name}</div>
                            <div class="card-company">${item.company || '個人 / 自由職業'}</div>
                        </div>
                        <div class="card-tags">${tags}</div>
                    </div>
                    <div class="card-meta">
                        ${phone}${email}${ctx}
                    </div>
                    <div class="card-notes ${hasNotes ? '' : 'empty'}">
                        ${hasNotes ? item.notes : '無詳細備註'}
                    </div>
                </div>`;
        });
    }
</script>

</body>
</html>
