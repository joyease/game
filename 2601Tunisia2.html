<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>2601突尼西亞</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0; 
      padding: 0;
    }
    #map {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }
    /* 讓地名標籤更精美 */
    .city-label {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #666;
      border-radius: 4px;
      padding: 2px 5px;
      font-weight: bold;
      color: #333;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const jsonUrl = 'https://raw.githubusercontent.com/joyease/game/main/2601tunisia.json';
    const map = L.map('map').setView([35.33, 9.66], 7); // 初始縮放稍微拉遠看全境

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // --- 🔹 新增：自定義地名標注 ---
    const cities = [
      { name: "突尼斯 (Tunis)", pos: [36.8065, 10.1815] },
      { name: "蘇斯 (Sousse)", pos: [35.8256, 10.6084] },
      { name: "雪尼尼 (Chenini)", pos: [32.9114, 10.2618] },
      { name: "吐澤 (Tozeur)", pos: [33.9197, 8.1335] },
      { name: "米代斯 (Mides)", pos: [34.4056, 7.9194] },
      { name: "杜茲 (Douz)", pos: [33.4611, 9.0203] },
      { name: "杜加 (Dougga)", pos: [36.4227, 9.2201] }
    ];

    cities.forEach(city => {
      // 使用 invisible marker 僅顯示文字
      L.circleMarker(city.pos, { radius: 0, opacity: 0 })
        .addTo(map)
        .bindTooltip(city.name, { 
          permanent: true, 
          direction: 'top', 
          className: 'city-label',
          offset: [0, -5] 
        });
    });
    // ----------------------------

    fetch(jsonUrl)
      .then(response => response.json())
      .then(data => {
        const latlngs = [];
        let index = 0;
        const colors = ['red', 'blue', 'green', 'red', 'blue', 'green'];

        map.fitBounds(L.latLngBounds(data.map(p => [p.latitude, p.longitude])));

        function addNextPoint() {
          if (index >= data.length) return;
          const point = data[index];
          const latLng = [point.latitude, point.longitude];
          latlngs.push(latLng);

          const colorIndex = Math.floor(index / 20) % colors.length;
          const markerColor = colors[colorIndex];

          const circleMarker = L.circleMarker(latLng, {
            radius: 2,
            fillColor: markerColor,
            color: 'blue',
            weight: 0.4,
            fillOpacity: 0.7
          }).addTo(map);

          circleMarker.bindPopup(
            `<b>標籤:</b> ${point.label}<br>` +
            `<b>海拔:</b> ${point.elevation} m<br>` +
            `經度: ${point.longitude}<br>` +
            `緯度: ${point.latitude}`
          );

          if (latlngs.length > 1) {
            L.polyline(
              [latlngs[latlngs.length - 2], latlngs[latlngs.length - 1]], 
              {
                color: markerColor,
                weight: 1,
                dashArray: '3, 3'
              }
            ).addTo(map);
          }

          index++;
          setTimeout(addNextPoint, 200);
        }

        addNextPoint();
      })
      .catch(err => {
        console.error('載入JSON出錯:', err);
      });
  </script>
</body>
</html>
