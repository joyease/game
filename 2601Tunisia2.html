<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>2601突尼西亞</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0; 
      padding: 0;
    }
    #map {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <h3>2601突尼西亞</h3>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const jsonUrl = 'https://raw.githubusercontent.com/joyease/game/main/2601tunisia.json';
    const map = L.map('map').setView([35.33, 9.66], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 🔹 標示特定地名：Mark 在上，縮小後的深灰色文字在下
    const cities = [
      { name: "突尼斯", pos: [36.8565, 10.1815] },
      { name: "蘇斯", pos: [35.8148, 10.6084] },
      { name: "雪尼尼", pos: [32.9014, 10.2618] },
      { name: "吐澤", pos: [33.9197, 8.1335] },
      { name: "米代斯", pos: [34.4056, 7.9194] },
      { name: "開羅安", pos: [35.6937, 10.0944] },
      { name: "杜茲", pos: [33.4354, 9.0203] },
      { name: "杜加", pos: [36.4427, 9.2201] }
    ];

    cities.forEach(city => {
      // 畫出 Mark (藍色點)
      L.circleMarker(city.pos, {
        radius: 3,
        color: 'blue',
        fillColor: 'blue',
        fillOpacity: 1,
        weight: 1
      }).addTo(map)
      .bindTooltip(city.name, { 
        permanent: true, 
        direction: 'bottom', // 文字在點的下方
        opacity: 1,
        className: 'custom-city-label' 
      });
    });

    // 動態加入 CSS 樣式 (符合您不更動頂部 <style> 的需求)
    const style = document.createElement('style');
    style.innerHTML = `
      .custom-city-label {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        color: #555555 !important;  /* 深灰色 */
        font-weight: bold;
        font-size: 9px;            /* 縮小字體 */
        padding: 0 !important;
      }
      .custom-city-label:before { display: none !important; }
    `;
    document.head.appendChild(style);

    fetch(jsonUrl)
      .then(response => response.json())
      .then(data => {
        const latlngs = [];
        let index = 0;
        const colors = ['red', 'blue', 'green', 'red', 'blue', 'green'];

        map.fitBounds(L.latLngBounds(data.map(p => [p.latitude, p.longitude])));

        function addNextPoint() {
          if (index >= data.length) return;
          const point = data[index];
          const latLng = [point.latitude, point.longitude];
          latlngs.push(latLng);

          const colorIndex = Math.floor(index / 20) % colors.length;
          const markerColor = colors[colorIndex];

          const circleMarker = L.circleMarker(latLng, {
            radius: 2,
            fillColor: markerColor,
            color: 'blue',
            weight: 0.4,
            fillOpacity: 0.7
          }).addTo(map);

          circleMarker.bindPopup(
            `<b>標籤:</b> ${point.label}<br>` +
            `<b>海拔:</b> ${point.elevation} m<br>` +
            `經度: ${point.longitude}<br>` +
            `緯度: ${point.latitude}`
          );

          if (latlngs.length > 1) {
            L.polyline(
              [latlngs[latlngs.length - 2], latlngs[latlngs.length - 1]], 
              {
                color: markerColor,
                weight: 1,
                dashArray: '3, 3'
              }
            ).addTo(map);
          }

          index++;
          setTimeout(addNextPoint, 200);
        }

        addNextPoint();
      })
      .catch(err => {
        console.error('載入JSON出錯:', err);
      });
  </script>
</body>
</html>
