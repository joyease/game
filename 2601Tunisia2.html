<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>2601突尼西亞</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0; 
      padding: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    h3 {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      margin: 0;
      background: rgba(255, 255, 255, 0.7);
      padding: 5px 10px;
      border-radius: 5px;
    }

    /* --- 中文字體樣式：無框、無底色 --- */
    .city-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #000;          /* 文字顏色 */
      font-weight: bold;
      font-size: 14px;
      text-shadow: 
        1px 1px 0 #fff, 
       -1px -1px 0 #fff, 
        1px -1px 0 #fff, 
       -1px 1px 0 #fff;    /* 白色文字外描邊，確保在深色地圖上也看得見 */
      white-space: nowrap;
    }

    /* 移除 Tooltip 的小箭頭 */
    .leaflet-tooltip-top:before, 
    .leaflet-tooltip-bottom:before, 
    .leaflet-tooltip-left:before, 
    .leaflet-tooltip-right:before {
      display: none !important;
    }
  </style>
</head>
<body>
  <h3>2601突尼西亞</h3>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const jsonUrl = 'https://raw.githubusercontent.com/joyease/game/main/2601tunisia.json';
    
    // 初始化地圖
    const map = L.map('map').setView([34.0, 9.0], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // --- 🔹 定義主要地名標註 ---
    const cities = [
      { name: "突尼斯 (Tunis)", pos: [36.8065, 10.1815] },
      { name: "蘇斯 (Sousse)", pos: [35.8256, 10.6084] },
      { name: "雪尼尼 (Chenini)", pos: [32.9114, 10.2618] },
      { name: "吐澤 (Tozeur)", pos: [33.9197, 8.1335] },
      { name: "米代斯 (Mides)", pos: [34.4056, 7.9194] },
      { name: "杜茲 (Douz)", pos: [33.4611, 9.0203] },
      { name: "杜加 (Dougga)", pos: [36.4227, 9.2201] }
    ];

    // 在地圖上畫出地名標記 (標記在文字上方)
    cities.forEach(city => {
      L.circleMarker(city.pos, {
        radius: 4,
        color: 'blue',
        fillColor: 'blue',
        fillOpacity: 1,
        weight: 1
      }).addTo(map)
      .bindTooltip(city.name, { 
        permanent: true, 
        direction: 'bottom', // 文字在點的下方
        className: 'city-label',
        offset: [0, 5]      // 調整文字與點的距離
      });
    });

    // --- 🔹 讀取路徑資料並繪製 ---
    fetch(jsonUrl)
      .then(response => response.json())
      .then(data => {
        const latlngs = [];
        let index = 0;
        const colors = ['red', 'blue', 'green', 'red', 'blue', 'green'];

        // 自動縮放至路徑範圍
        map.fitBounds(L.latLngBounds(data.map(p => [p.latitude, p.longitude])));

        function addNextPoint() {
          if (index >= data.length) return;
          const point = data[index];
          const latLng = [point.latitude, point.longitude];
          latlngs.push(latLng);

          const colorIndex = Math.floor(index / 20) % colors.length;
          const markerColor = colors[colorIndex];

          // 繪製路徑上的小點
          const circleMarker = L.circleMarker(latLng, {
            radius: 2,
            fillColor: markerColor,
            color: 'blue',
            weight: 0.4,
            fillOpacity: 0.7
          }).addTo(map);

          circleMarker.bindPopup(
            `<b>標籤:</b> ${point.label}<br>` +
