<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛跑咖 - 管理員後台</title>
    <!-- 引入 Firebase 核心、Firestore 以及 Auth 驗證功能 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; background-color: #f9f9f9; }
        button { padding: 8px 15px; cursor: pointer; font-weight: bold; margin-top: 5px;}
        input { padding: 6px; width: 90%; margin-bottom: 10px; }
        .danger { background-color: #ff4d4d; color: white; border: none; }
        .primary { background-color: #007bff; color: white; border: none; }
        .secondary { background-color: #28a745; color: white; border: none; }
    </style>
</head>
<body>

    <h2>🏃‍♂️ 愛跑咖 - 管理員主控台</h2>
    <hr>

    <!-- 區塊一：登入表單 -->
    <div id="login-form" class="card">
        <h3>管理員登入</h3>
        <p>Email: <input type="email" id="admin-email" placeholder="請輸入管理員信箱"></p>
        <p>密碼: <input type="password" id="admin-pwd" placeholder="請輸入密碼"></p>
        <button class="primary" onclick="login()">登入後台</button>
    </div>

    <!-- 區塊二：管理面板（登入後才顯示） -->
    <div id="admin-panel" style="display: none;">
        <p>歡迎回來，管理員！ <button onclick="logout()">登出</button></p>

        <!-- 功能 (1)：新增或覆蓋團隊 -->
        <div class="card">
            <h3>🔑 (1) 新增 / 更新團隊密碼</h3>
            <p>團隊編號 (tripcode): <input type="text" id="new-code" placeholder="例如: taiwan2026"></p>
            <p>通行碼 (passcode): <input type="text" id="new-pass" placeholder="例如: 1234"></p>
            <button class="secondary" onclick="addTrip()">建立 / 覆蓋團隊</button>
        </div>

        <!-- 功能 (2)；變更團隊代碼 (保留舊數據、防 DDOS) -->
        <div class="card">
            <h3>🔄 (2) 變更團隊代碼 (封存舊房間、保留軌跡)</h3>
            <p>目前的團隊編號: <input type="text" id="move-old" placeholder="例如: taiwan2026"></p>
            <p>變更為新編號: <input type="text" id="move-new" placeholder="例如: taiwan2026_done"></p>
            <button class="primary" onclick="renameTrip()">變更代碼並封存</button>
            <small style="color: #666; display: block; margin-top: 5px;">
                * 說明：這會將進行中的房間更名。原有的成員只要網頁一關掉就再也進不來（達到防 DDOS 效果），但他們之前跑出來的 GPS 軌跡資料會安全地留在資料庫中。
            </small>
        </div>

        <!-- 功能 (3)：刪除特定團隊所有資料 -->
        <div class="card" style="border: 1px solid #ff4d4d;">
            <h3 style="color: #ff4d4d;">🗑️ (3) 徹底刪除某團隊所有資料</h3>
            <p>要刪除的團隊編號: <input type="text" id="del-code" placeholder="例如: taiwan2026"></p>
            <button class="danger" onclick="deleteTripData()">完全刪除所有數據 (不可逆)</button>
        </div>
    </div>

    <script>
        // 貼上你的 Firebase 專案設定
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 監聽登入狀態切換 UI
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
            }
        });

        // 登入功能
        function login() {
            const email = document.getElementById('admin-email').value;
            const pwd = document.getElementById('admin-pwd').value;
            auth.signInWithEmailAndPassword(email, pwd)
                .catch(err => alert("登入失敗: " + err.message));
        }

        // 登出功能
        function logout() { auth.signOut(); }

        // 【操作 1】新增/更新團隊
        async function addTrip() {
            const code = document.getElementById('new-code').value.trim();
            const pass = document.getElementById('new-pass').value.trim();
            if(!code || !pass) return alert("請填寫完整欄位");

            await db.collection("trips").doc(code).set({ passcode: pass });
            alert(`團隊 [${code}] 建立/更新成功！`);
            document.getElementById('new-code').value = '';
            document.getElementById('new-pass').value = '';
        }

        // 【操作 2】變更代碼（保留數據、防範 DDOS）
        async function renameTrip() {
            const oldCode = document.getElementById('move-old').value.trim();
            const newCode = document.getElementById('move-new').value.trim();
            if(!oldCode || !newCode) return alert("請填寫完整欄位");

            const oldDoc = await db.collection("trips").doc(oldCode).get();
            if(!oldDoc.exists) return alert("找不到原有的團隊編號！");

            // 複製密碼到新代碼文件，並刪除舊文件
            const pass = oldDoc.data().passcode;
            await db.collection("trips").doc(newCode).set({ passcode: pass });
            await db.collection("trips").doc(oldCode).delete();

            alert(`代碼變更成功！舊代碼 [${oldCode}] 已失效，新代碼 [${newCode}] 已啟用。舊定位數據已成功保留。`);
            document.getElementById('move-old').value = '';
            document.getElementById('move-new').value = '';
        }

        // 【操作 3】徹底刪除某團隊所有資料 (trips + locations + members)
        async function deleteTripData() {
            const code = document.getElementById('del-code').value.trim();
            if(!code) return alert("請輸入要刪除的團隊編號");
            
            if(!confirm(`確定要完全刪除 [${code}] 的所有設定、成員與 GPS 定位軌跡嗎？此動作無法復原！`)) return;

            const batch = db.batch();

            // 1. 刪除房間設定
            batch.delete(db.collection("trips").doc(code));

            // 2. 撈出所有該房間的 locations 並加入刪除隊列
            const locSnap = await db.collection("locations").where("tripcode", "==", code).get();
            locSnap.forEach(doc => batch.delete(doc.ref));

            // 3. 撈出所有該房間的 members 並加入刪除隊列
            const memSnap = await db.collection("members").where("tripcode", "==", code).get();
            memSnap.forEach(doc => batch.delete(doc.ref));

            // 執行批量刪除
            await batch.commit();
            alert(`團隊 [${code}] 的所有關聯數據已徹底灰飛煙滅！`);
            document.getElementById('del-code').value = '';
        }
    </script>
</body>
</html>
