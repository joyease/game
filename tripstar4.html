<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Spline+Sans%3Awght%40400%3B500%3B700"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>運動旅遊</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #ea2a33;
      }
    </style>
    <title>GPS 地圖標記展示</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
      body {
        font-family: "Noto Sans TC", Arial, sans-serif;
        min-height: max(880px, 100dvh);
      }
      #map {
        width: 100%;
        height: 800px; /* 固定高度 */
        max-height: 80vh; /* 避免太高 */
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      @media (max-width: 768px) {
        #map {
          height: 50vh; /* 手機時縮小一點 */
        }
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div
      class="relative flex size-full min-h-screen flex-col justify-between group/design-root"
      style='font-family: "Spline Sans", "Noto Sans", sans-serif;'
    >
      <div class="flex-grow">
        <div class="relative">
          <div
            class="w-full bg-center bg-no-repeat bg-cover h-96"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCbhDMytwDSazkAp-qAGAoAkyiwgWBxTdIPp8mJBFBoZlaSIfGdUXeiYC-GeR9RDyTiu0tKq0kSACBUESrA6QrFr_uB9fUOo_JOBGvvzgilqazNun0wTa-P7xcJ7F4a456Jp2-Fj4lBa10PVKAaQqEcGoiFAYJ7axVlQJFIXDlIUycqo6pPxVi30_KPCRittxrLvQSa-jUlze7mjQo-zJxujTL8PuvRrrT9V6FZ-eazgGtw2lSNrtEEac7vW8wsy6blF7h21lRGnRjM");'
          >
            <div class="absolute inset-0 bg-black/20"></div>
          </div>
          <div class="absolute inset-x-0 bottom-0 px-4 pb-6">
            <h1 class="text-4xl font-bold text-white mb-2"> Trip 點點相連</h1>
            <p class="text-lg text-white/90">連接全球到訪過的城鎮</p>
            <div class="mt-4">
              <label class="flex flex-col min-w-40 w-full">
                <div class="flex w-full flex-1 items-stretch rounded-full shadow-lg h-14">
                  <div class="text-gray-500 flex bg-white items-center justify-center pl-5 rounded-l-full">
                    <span class="material-symbols-outlined"> search </span>
                  </div>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-full text-gray-800 focus:outline-0 focus:ring-0 border-none bg-white focus:border-none h-full placeholder:text-gray-500 px-4 text-base font-normal leading-normal"
                    placeholder="搜尋目的地或活動"
                    value=""
                  />
                </div>
              </label>
            </div>
          </div>
        </div>

        <h2 class="mt-6 text-xl font-bold px-4">Trip 點點相連</h2>
        <p class="px-4">連接到訪過的城鎮</p>
        <p class="px-4 mb-2">點開小點有一些註記</p>
        
        <div id="map"></div>

        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script>
        let map;

        function initMap() {
            map = L.map('map').setView([36.1408, -5.3536], 2); // 預設直布羅陀中心

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap 貢獻者'
            }).addTo(map);

            fetchDataAndPlot();
        }

        async function fetchDataAndPlot() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/aidusu/3kingdom/main/travel.json');
                const data = await response.json();

                // 逐一延遲顯示點位
                data.forEach((point, index) => {
                    setTimeout(() => {
                        addMarker(point.lat, point.lng, point.label, point.date, point.note);
                    }, index * 800); // 每個點間隔 0.8 秒
                });
            } catch (error) {
                console.error('載入資料失敗:', error);
                alert('無法載入GPS資料，請稍後再試。');
            }
        }

        function addMarker(lat, lng, label = '未命名地點', date = '', note = '') {
            const popupContent = `
                <b>${label}</b><br>
                緯度: ${lat}<br>
                經度: ${lng}<br>
                日期: ${date}<br>
                備註: ${note}
            `;
            L.circleMarker([lat, lng], {
                radius: 3,
                color: "#ff7f00",   // 外框顏色
                fillColor: "#0000ff", // 填滿顏色
                fillOpacity: 0.9
            })
            .addTo(map)
            .bindPopup(popupContent);
        }

        document.addEventListener('DOMContentLoaded', initMap);
		</script>
      </div>

      <div class="sticky bottom-0">
        <div class="flex gap-2 border-t border-gray-200 bg-white px-4 pb-3 pt-2 shadow-t-lg">
          <a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[var(--primary-color)]" href="https://sportrip7.wordpress.com">
            <span class="material-symbols-outlined"> explore </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">SporTrip創新探索</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="https://www.mysports.net.tw">
            <span class="material-symbols-outlined"> favorite </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">MySports社群網站</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="http://sites.google.com/view/mytrip">
            <span class="material-symbols-outlined">home</span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">TripStar</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="#">
            <span class="material-symbols-outlined"> inbox </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">聯絡信箱</p>
          </a>
          <a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-500" href="#">
            <span class="material-symbols-outlined"> account_circle </span>
            <p class="text-xs font-medium leading-normal tracking-[0.015em]">Hermann Huang</p>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
