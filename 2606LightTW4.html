<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>來運動，一起點亮22縣市</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; }
        #nickname { font-size: 28px; font-weight: bold; padding: 15px; width: 400px; border: 3px solid #ddd; border-radius: 10px; text-align: center; margin: 20px; letter-spacing: 3px; background: #f9f9f9; }
        #nickname:focus { border-color: #4CAF50; outline: none; box-shadow: 0 0 15px rgba(76,175,80,0.3); }
        button { font-size: 20px; padding: 15px 30px; margin: 0 10px; border: none; border-radius: 10px; cursor: pointer; background: #4CAF50; color: white; font-weight: bold; }
        button:hover { background: #45a049; }
        #status { margin: 20px 0; font-size: 18px; font-weight: bold; min-height: 30px; }
        #map { width: 100%; border: 3px solid #ddd; border-radius: 15px; background: #f8f9fa; margin: 20px 0; }
        .legend { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; font-size: 15px; font-weight: bold; }
        .legend-item { display: flex; align-items: center; gap: 10px; background: white; padding: 12px 18px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .legend-color { width: 36px; height: 26px; border-radius: 6px; border: 3px solid #333; }
        #loading { display: none; color: #666; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MySports 點亮台灣</h1>
        <p style="color:#666; font-size:20px;">輸入月份查看22縣市點亮圖</p>
        <input type="text" id="nickname" placeholder="輸入月份（如：202604,202605, 累計...）">
        <br><button onclick="loadUserData()">🔍 查詢地圖</button>
        <div id="status">輸入月份查看點亮地圖</div>
        <div id="loading">🔄 載入台灣地圖中...</div>

        <svg id="map" viewBox="0 0 14000 14000" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">
            <defs>
                <style>
                    .county { stroke: #555; stroke-width: 1.5; fill: #ccc; transition: all 0.4s; cursor: pointer; }
                    .county:hover { stroke-width: 3; stroke: #000; opacity: 0.95; }
                </style>
            </defs>
            <g id="county-group"></g>
        </svg>

        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#999;"></div>0 — 未去過</div>
            <div class="legend-item"><div class="legend-color" style="background:#4CAF50;"></div>1 — 1~99 次</div>
            <div class="legend-item"><div class="legend-color" style="background:#FFEB3B;"></div>2 — 100~499 次</div>
            <div class="legend-item"><div class="legend-color" style="background:#FF9800;"></div>3 — 500~999 次</div>
            <div class="legend-item"><div class="legend-color" style="background:#F44336;"></div>4 — 1000~4999 次</div>
            <div class="legend-item"><div class="legend-color" style="background:#9C27B0;"></div>5 — 5000 次以上</div>
        </div>
    </div>

    <script>
        // 六個級距對應顏色：灰、綠、黃、橙、紅、紫
        const colors = ['#999', '#4CAF50', '#FFEB3B', '#FF9800', '#F44336', '#9C27B0'];

        let countiesData = [];
        let countyElements = {};

        // 啟動時載入台灣地圖JSON
        async function initMap() {
            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch('taiwan_counties.json');
                const json = await response.json();
                countiesData = json.counties;

                const group = document.getElementById('county-group');
                countiesData.forEach((county, index) => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.id = county.id;
                    path.setAttribute('class', 'county');
                    path.setAttribute('title', county.title);
                    path.setAttribute('d', county.path);
                    path.dataset.index = index;
                    countyElements[county.id] = path;
                    group.appendChild(path);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerHTML = `✅ 地圖載入完成！發現 ${countiesData.length} 個縣市`;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerHTML = '❌ 無法載入 taiwan_counties.json，請確認檔案存在';
                console.error('JSON載入錯誤:', error);
            }
        }

        // 查詢用戶資料
        async function loadUserData() {
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) {
                document.getElementById('status').innerHTML = '⚠️ 請輸入月份';
                return;
            }

            document.getElementById('status').innerHTML = '🔄 載入用戶資料...';

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('data.json 載入失敗');

                const data = await response.json();
                const userData = data.users[nickname];

                if (userData && userData.length === countiesData.length) {
                    // ✅ 字串格式：每個字元是 0~5，直接轉成數字陣列
                    const arr = typeof userData === 'string'
                        ? userData.split('').map(Number)
                        : userData;

                    const visitedCount = arr.filter(n => n > 0).length;
                    document.getElementById('status').innerHTML =
                        `✅ ${nickname} 已點亮 ${visitedCount}/${countiesData.length} 個縣市`;
                    updateMap(arr);
                } else {
                    document.getElementById('status').innerHTML =
                        `❌ 未找到 "${nickname}" 的資料，或縣市數量不符（需 ${countiesData.length} 碼）`;
                }

            } catch (error) {
                document.getElementById('status').innerHTML = '❌ 載入失敗，請確認 data.json 存在';
                console.error('錯誤:', error);
            }
        }

        // 更新地圖顏色與縣市名稱
        function updateMap(arr) {
            // 清除舊的文字標籤
            document.querySelectorAll('#map text').forEach(t => t.remove());

            countiesData.forEach((county, i) => {
                const path = countyElements[county.id];
                if (path) {
                    const level = arr[i] || 0;                  // 0~5
                    path.style.fill = colors[level] || '#999';
                    path.title = `${county.title}: 等級 ${level}`;

                    if (level > 0 && county.center) {
                        const [cx, cy] = county.center;
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', cx);
                        text.setAttribute('y', cy);
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('dominant-baseline', 'middle');
                        text.setAttribute('font-size', '300');
                        text.setAttribute('fill', '#333');
                        text.setAttribute('pointer-events', 'none');
                        text.textContent = county.title;
                        document.getElementById('map').appendChild(text);
                    }
                }
            });
        }

        document.getElementById('nickname').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadUserData();
        });

        window.onload = () => { initMap(); };
    </script>
</body>
</html>
