<!DOCTYPE html>
<html>
<head>
    <title>繞著地球跑</title>
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="https://unpkg.com/topojson@3/dist/topojson.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(circle, #000428 0%, #004e92 70%); 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }
        #buttons { 
            position: absolute; top: 80px; 
            z-index: 10;
            display: flex; gap: 10px;
        }
        .traveler-btn { 
            padding: 12px 24px; 
            font-size: 18px; 
            border: none; 
            border-radius: 25px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            cursor: pointer; 
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .traveler-btn:hover { 
            background: rgba(255,215,0,0.8); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,215,0,0.4);
        }
        .traveler-btn.active { 
            background: #FFD700 !important; 
            color: #000; 
            box-shadow: 0 0 20px #FFD700;
        }
        h1 { 
            position: absolute; top: 20px; 
            font-size: clamp(24px, 5vw, 48px); 
            text-shadow: 0 0 20px #FFD700; 
            z-index: 10;
        }
        #worldmap { 
            flex: 1; 
            max-width: 95vw; 
            max-height: 85vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        #worldmap svg { 
            width: 95vmin !important; 
            height: 95vmin !important; 
            background: rgba(0,20,60,0.6); 
            border-radius: 50%; 
            box-shadow: 0 0 100px rgba(255,215,0,0.5), inset 0 0 100px rgba(0,0,0,0.5); 
            cursor: grab; 
            transition: box-shadow 0.3s ease;
        }
        #worldmap svg:active { cursor: grabbing; }
        .ocean { fill: #001122; }
        .land { 
            fill: rgba(200,200,200,0.7); 
            stroke: rgba(255,255,255,0.3); 
            stroke-width: 0.8px; 
            transition: all 0.4s ease;
        }
        .visited { 
            fill: #FFD700 !important; 
            stroke: #FFA500 !important; 
            stroke-width: 3px; 
            filter: drop-shadow(0 0 10px #FFD700);
        }
        .land:hover { stroke-width: 3px; filter: brightness(1.3); }
        #info { 
            position: absolute; bottom: 20px; 
            font-size: clamp(16px, 3vw, 24px); 
            background: rgba(0,0,0,0.7); 
            padding: 15px 25px; 
            border-radius: 25px; 
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>🌍 三人旅行地球儀</h1>
    
    <div id="buttons"></div>
    
    <div id="worldmap"></div>
    <p id="info">拖曳旋轉 | 黃金色=去過國家 | Hover查看詳情</p>

    <script>
        // 三人去過國家列表
        const travelers = {
            'Hermann': ['Taiwan', 'Japan','Poland', 'Hungary','Slovak Rep.','South Korea', 'Austria', 'Australia', 'Belgium', 'Switzerland', 'China', 'Czech Republic', 'Germany', 'Estonia', 'Spain', 'Finland', 'France', 'United Kingdom', 'Hong Kong', 'Ireland', 'Italy', 'Cambodia', 'Gibralta', 'Sri Lanka', 'Macau', 'Malaysia', 'Netherlands', 'Norway', 'Portugal', 'Russia', 'Sweden','Singapore', 'Thailand', 'Tunisia', 'Turkey', 'Vatican City', 'Vietnam', 'India', 'United States of America', 'United Arab Emirates'],
            'Sunny': ['Taiwan', 'Japan','Poland', 'Hungary','Slovak Rep.', 'South Korea', 'Austria', 'Australia', 'Belgium', 'Switzerland', 'China', 'Czech Republic', 'Germany', 'Estonia', 'Spain', 'Finland', 'France', 'United Kingdom', 'Hong Kong', 'Ireland', 'Italy', 'Cambodia', 'Gibralta', 'Macau', 'Malaysia', 'Netherlands', 'Norway', 'Portugal', 'Russia', 'Sweden','Singapore', 'Thailand', 'Tunisia', 'Turkey', 'Vatican City', 'Vietnam', 'India', 'United States of America', 'United Arab Emirates', 'Iceland'],
            'Tom': ['Taiwan', 'Argentina', 'New Zealand', 'Indonesia', 'Japan','South Korea','Austria','Australia','Belgium','Switzerland','China','Czech Republic','Germany','Estonia','Spain','Finland','France','United Kingdom','Hong Kong','Ireland','Italy','Cambodia','Sri Lanka','Macau','Malaysia','Netherlands','Norway','Portugal','Russia','Sweden','Singapore','Thailand','Turkey','Vatican City','Vietnam','India','United States of America','United Arab Emirates','Denmark','Jordan','Israel', 'Morocco', 'Algeria', 'Egypt', 'South Africa', 'Madagascar', 'Philippines']
		};

        const size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
        const projection = d3.geoOrthographic()
            .scale(size * 0.4)
            .translate([size / 2, size / 2])
            .clipAngle(90);

        const path = d3.geoPath().projection(projection);
        const svg = d3.select("#worldmap").append("svg")
            .attr("width", size).attr("height", size)
            .call(d3.drag().on("drag", e => {
                const r = projection.rotate();
                projection.rotate([r[0] + e.dx * 0.3, Math.max(-90, Math.min(90, r[1] - e.dy * 0.3))]);
                svg.selectAll("path").attr("d", path);
            }));

        let currentTraveler = 'Hermann';
        let lands, landData;

        // 創建切換按鈕
        const buttons = d3.select("#buttons").selectAll(".traveler-btn")
            .data(Object.keys(travelers))
            .enter().append("button")
            .attr("class", "traveler-btn")
            .text(d => d)
            .on("click", function(event, traveler) {
                switchTraveler(traveler);
            });

        function switchTraveler(traveler) {
            currentTraveler = traveler;
            
            // 更新按鈕狀態
            buttons.classed("active", d => d === traveler);
            
            // 更新地圖高亮
            const visitedNames = travelers[traveler];
            let count = 0;
            
            lands.classed("visited", false);
            lands.each(function(d) {
                if (visitedNames.some(v => d.properties.name?.includes(v))) {
                    d3.select(this).classed("visited", true); 
                    count++;
                }
            });
            
            // 更新標題和資訊  用40 替換 ${count}
            d3.select("h1").text(`🌍 ${traveler} 的旅行地球儀`);
            d3.select("#info").text(`${traveler} 遊歷 40 國 | 探索世界`);
        }

        d3.json("https://unpkg.com/world-atlas@2.0.2/countries-110m.json").then(world => {
            const land = topojson.feature(world, world.objects.countries);
            
            svg.append("path").datum({type: "Sphere"}).attr("class", "ocean").attr("d", path);
            
            landData = land.features;
            lands = svg.selectAll(".land").data(landData).enter().append("path")
                .attr("class", "land").attr("d", path);

            // 初始化 Hermann
            switchTraveler('Hermann');
            
            lands.on("mouseover", function(event, d) {
                const name = d.properties.name || 'Unknown';
                const visited = travelers[currentTraveler].some(v => name.includes(v));
                d3.select("#info").text(`${name} ${visited ? '✅' + currentTraveler + '去過' : '❌未去過'} (${currentTraveler})`);
            }).on("mouseout", () => {
                const count = travelers[currentTraveler].length;
                d3.select("#info").text(`${currentTraveler} 遊歷 40 國 | 探索世界`);
            });
        });
    </script>
</body>
</html>
