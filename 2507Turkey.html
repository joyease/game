<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>OpenStreetMap 座標點逐點顯示示範</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  html, body {
    height: 100%;
    margin:0; padding:0;
  }
  #map {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>
<h3>土耳其之旅:伊斯坦堡-安卡拉-番紅花-卡帕多奇亞-棉堡-地中海-愛琴海</h3>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const jsonUrl = 'https://raw.githubusercontent.com/joyease/game/main/2507Turkey.json';
const map = L.map('map').setView([38.0, 31.4], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);
fetch(jsonUrl)
.then(response => response.json())
.then(data => {
  const latlngs = [];
  let index = 0;
  map.fitBounds(L.latLngBounds(data.map(p => [p.Latitude, p.Longitude])));
  function addNextPoint() {
    if (index >= data.length) return;
    const point = data[index];
    const latLng = [point.Latitude, point.Longitude];
    latlngs.push(latLng);
    const circleMarker = L.circleMarker(latLng, {
      radius: 3,
      fillColor: 'yellow',
      color: 'black',
      weight: 2,
      fillOpacity: 0.6
    }).addTo(map);
    circleMarker.bindPopup(`<b>地點:</b> ${point.Location}<br><b>日期:</b> ${point.Date}`);
    if (latlngs.length > 1) {
      const line = L.polyline([latlngs[latlngs.length-2], latlngs[latlngs.length-1]], {
        color: 'blue',
        weight: 1,
        dashArray: '5, 10'
      }).addTo(map);
    }
    index++;
    setTimeout(addNextPoint, 300);
  }
  addNextPoint();
})
.catch(err => {
  console.error('載入JSON出錯:', err);
});
</script>
</body>
</html>
