<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Health Tracker</title>

    <!-- 1. TailwindCSS 載入 (標準 CDN 引入方式) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e65e",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

    <!-- 2. Google Fonts 和 Material Symbols 載入 -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Material Symbols Settings -->
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24;
        }
        body {
            /* 確保內容足夠長，可以填滿螢幕 */
            min-height: 100vh; 
        }
    </style>
    
    <!-- 3. Chart.js 圖表函式庫 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

</head>
<body class="font-display bg-background-light dark:bg-background-dark text-background-dark dark:text-background-light">
    <div class="relative flex min-h-screen flex-col justify-between">
        <div>
            <!-- Header -->
            <header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark sticky top-0 z-10 border-b border-primary/10">
                <div class="w-12"></div>
                <h1 class="flex-1 text-center text-lg font-bold">健康追蹤</h1>
                <div class="flex w-12 items-center justify-end">
                    <button class="flex items-center justify-center rounded-full h-10 w-10">
                        <span class="material-symbols-outlined">settings</span>
                    </button>
                </div>
            </header>
            
            <!-- Message Box (FIXED position for notifications) -->
            <!-- 新增訊息框 UI 元素 -->
            <div id="message-box" class="fixed top-16 left-0 right-0 z-50 px-4 transform transition-all duration-300 translate-y-[-100%] opacity-0">
                <div id="message-content" class="rounded-lg p-3 text-sm font-medium shadow-xl flex items-center gap-2"></div>
            </div>

            <!-- Main Content -->
            <main class="px-4 py-6">
                <!-- Cover Image Section (使用 Google Drive 轉換後的 URL) -->
                <section class="mb-8">
                    <div class="relative h-48 rounded-xl overflow-hidden mb-4 shadow-lg">
                        <!-- 這是 Google Drive 檔案的直接內容連結 -->
                        <img alt="A person cycling on a scenic trail with mountains and a lake in the background."
                            class="w-full h-full object-cover"
                            src="https://drive.google.com/uc?export=view&id=1w_hb97OV2rZ0lFP0HQ8bPWHr45UZ3wJG"/>
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                            <h1 class="text-3xl font-bold text-white text-center">數據紀錄，一目了然</h1>
                        </div>
                    </div>
                </section>

                <!-- Today's Activity (使用手機 2 欄 / 電腦 4 欄的響應式設計) -->
                <section class="mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">今日活動</h2>
                        <p class="text-sm font-medium text-background-dark/70 dark:text-background-light/70" id="current-date">載入中...</p>
                    </div>
                    
                    <!-- 手機 2 欄 (grid-cols-2)，電腦 4 欄 (lg:grid-cols-4) -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        
                        <!-- Calories Eaten -->
                        <div class="flex flex-col gap-1 rounded-lg p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-sm font-medium text-background-dark/70 dark:text-background-light/70">攝取熱量 (Kcal)</p>
                            <p class="text-2xl font-bold" id="calories-eaten-display">--</p>
                        </div>
                        
                        <!-- Calories Burned -->
                        <div class="flex flex-col gap-1 rounded-lg p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-sm font-medium text-background-dark/70 dark:text-background-light/70">消耗熱量 (Kcal)</p>
                            <p class="text-2xl font-bold" id="calories-burned-display">--</p>
                        </div>
                        
                        <!-- Steps -->
                        <div class="flex flex-col gap-1 rounded-lg p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-sm font-medium text-background-dark/70 dark:text-background-light/70">步數</p>
                            <p class="text-2xl font-bold" id="steps-display">--</p>
                        </div>
                        
                        <!-- Weight -->
                        <div class="flex flex-col gap-1 rounded-lg p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-sm font-medium text-background-dark/70 dark:text-background-light/70">體重 (kg)</p>
                            <p class="text-2xl font-bold" id="weight-display">--</p>
                        </div>
                    </div>
                </section>

                <!-- Trends Section (Chart.js Canvas) -->
                <section class="mb-8">
                    <h2 class="text-xl font-bold mb-4">趨勢圖表 (最近 7 天)</h2>
                    <div class="space-y-6">
                        <!-- Calories Trend -->
                        <div class="flex flex-col gap-2 rounded-xl p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-base font-medium">熱量趨勢</p>
                            <div class="pt-4">
                                <canvas id="caloriesChart"></canvas>
                            </div>
                        </div>

                        <!-- Weight Trend -->
                        <div class="flex flex-col gap-2 rounded-xl p-4 bg-white dark:bg-background-dark/50 border border-primary/20 dark:border-primary/30 shadow-md">
                            <p class="text-base font-medium">體重趨勢</p>
                            <div class="pt-4">
                                <canvas id="weightChart"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Data Input Section -->
                <section class="mb-8">
                    <h2 class="text-xl font-bold mb-4">數據輸入</h2>
                    <div class="space-y-4">
                        <!-- Input Field: Calories Eaten -->
                        <div class="flex items-center gap-2">
                            <label for="input-calories-eaten" class="w-1/3 text-sm font-medium">攝取熱量</label>
                            <input type="number" id="input-calories-eaten" placeholder="例如: 1850" class="flex-grow rounded-md border border-primary/30 p-2 dark:bg-background-dark/50 focus:border-primary focus:ring-primary"/>
                            <button onclick="updateData('calories-eaten')" class="bg-primary text-background-dark font-bold py-2 px-4 rounded-md hover:bg-primary/80 transition duration-150">提交</button>
                        </div>

                        <!-- Input Field: Calories Burned -->
                        <div class="flex items-center gap-2">
                            <label for="input-calories-burned" class="w-1/3 text-sm font-medium">消耗熱量</label>
                            <input type="number" id="input-calories-burned" placeholder="例如: 2150" class="flex-grow rounded-md border border-primary/30 p-2 dark:bg-background-dark/50 focus:border-primary focus:ring-primary"/>
                            <button onclick="updateData('calories-burned')" class="bg-primary text-background-dark font-bold py-2 px-4 rounded-md hover:bg-primary/80 transition duration-150">提交</button>
                        </div>

                        <!-- Input Field: Steps -->
                        <div class="flex items-center gap-2">
                            <label for="input-steps" class="w-1/3 text-sm font-medium">步數</label>
                            <input type="number" id="input-steps" placeholder="例如: 8250" class="flex-grow rounded-md border border-primary/30 p-2 dark:bg-background-dark/50 focus:border-primary focus:ring-primary"/>
                            <button onclick="updateData('steps')" class="bg-primary text-background-dark font-bold py-2 px-4 rounded-md hover:bg-primary/80 transition duration-150">提交</button>
                        </div>

                        <!-- Input Field: Weight -->
                        <div class="flex items-center gap-2">
                            <label for="input-weight" class="w-1/3 text-sm font-medium">體重 (kg)</label>
                            <input type="number" step="0.1" id="input-weight" placeholder="例如: 68.5" class="flex-grow rounded-md border border-primary/30 p-2 dark:bg-background-dark/50 focus:border-primary focus:ring-primary"/>
                            <button onclick="updateData('weight')" class="bg-primary text-background-dark font-bold py-2 px-4 rounded-md hover:bg-primary/80 transition duration-150">提交</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- Footer -->
        <footer class="sticky bottom-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm mt-8">
            <nav class="flex justify-around items-center border-t border-primary/20 dark:border-primary/30 px-2 pt-2 pb-4">
                <a class="flex flex-col items-center gap-1 text-primary" href="#">
                    <span class="material-symbols-outlined text-3xl">home</span>
                    <p class="text-xs font-bold">首頁</p>
                </a>
                <a class="flex flex-col items-center gap-1 text-background-dark/50 dark:text-background-light/50" href="#">
                    <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0">favorite</span>
                    <p class="text-xs font-medium">活動</p>
                </a>
                <a class="flex flex-col items-center gap-1 text-background-dark/50 dark:text-background-light/50" href="#">
                    <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0">person</span>
                    <p class="text-xs font-medium">個人檔案</p>
                </a>
            </nav>
        </footer>
    </div>

    <!-- JavaScript for Firebase, Data Submission, and Charting -->
    <script type="module">
        // 載入現代模組化 Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // -------------------------------------------------------------
        // A. FIREBASE 初始化與環境變數
        // -------------------------------------------------------------
        let db;
        let auth;
        let userId = 'loading'; // 用於追蹤認證狀態
        
        // 載入 Canvas 環境變數
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        /**
         * 初始化 Firebase 服務並進行使用者認證。
         */
        async function initializeFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // 優先使用自訂令牌登入，若無則使用匿名登入
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                // 取得使用者 ID (UID)
                userId = auth.currentUser?.uid || crypto.randomUUID();
                console.log("Firebase initialized. User ID:", userId);
                
                // 認證完成後，載入數據
                document.getElementById('current-date').textContent = displayDate(new Date());
                await fetchAndDrawCharts();

            } catch (error) {
                showMessage(`Firebase 初始化或登入失敗: ${error.message}`, true);
                console.error("Firebase Initialization Error:", error);
            }
        }
        
        /**
         * 建立私人數據集合的參照路徑。
         * 路徑範例: artifacts/default-app-id/users/some-uid/daily_data
         */
        function getDailyDataCollectionRef() {
            if (!db || userId === 'loading') {
                // 如果 Firebase 或 User ID 尚未就緒，拋出錯誤以避免權限問題
                throw new Error("Firestore 或使用者認證尚未就緒，請稍候。");
            }
            // 使用 Canvas 規範的私人資料路徑
            return collection(db, `artifacts/${appId}/users/${userId}/daily_data`);
        }


        // -------------------------------------------------------------
        // B. 輔助工具
        // -------------------------------------------------------------
        function formatDate(date) {
            // 將日期格式化為 YYYY-MM-DD
            return date.toISOString().split('T')[0];
        }

        function displayDate(date) {
            // 顯示格式：YYYY年MM月DD日 (星期X)
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            return date.toLocaleDateString('zh-TW', options);
        }

        /**
         * 顯示一個短暫的通知訊息。
         * @param {string} message - 要顯示的訊息內容。
         * @param {boolean} isError - 如果為 true，則顯示為錯誤訊息。
         */
        function showMessage(message, isError = false) {
            const box = document.getElementById('message-box');
            const content = document.getElementById('message-content');
            
            // 設定顏色和圖標
            if (isError) {
                content.className = 'rounded-lg p-3 text-sm font-medium shadow-xl flex items-center gap-2 bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300';
                content.innerHTML = '<span class="material-symbols-outlined">error</span> ' + message;
            } else {
                content.className = 'rounded-lg p-3 text-sm font-medium shadow-xl flex items-center gap-2 bg-primary/10 text-background-dark dark:bg-primary/30 dark:text-white';
                content.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ' + message;
            }

            // 顯示訊息
            box.classList.remove('translate-y-[-100%]', 'opacity-0');
            box.classList.add('translate-y-0', 'opacity-100');

            // 3 秒後自動隱藏
            setTimeout(() => {
                box.classList.remove('translate-y-0', 'opacity-100');
                box.classList.add('translate-y-[-100%]', 'opacity-0');
            }, 3000);
        }


        // -------------------------------------------------------------
        // C. 數據儲存邏輯
        // -------------------------------------------------------------
        /**
         * 將數據儲存到 Firestore，並更新前端顯示。
         * @param {string} type - 數據類型 (e.g., 'calories-eaten').
         */
        window.updateData = async function(type) {
            try {
                if (userId === 'loading') {
                    showMessage('應用程式仍在初始化中，請稍候再提交。', true);
                    return;
                }

                const inputId = `input-${type}`;
                const displayId = `${type}-display`;

                const inputElement = document.getElementById(inputId);
                const displayElement = document.getElementById(displayId);

                let newValue = inputElement.value.trim();
                if (newValue === '' || isNaN(parseFloat(newValue))) {
                    showMessage('請輸入有效的數值', true);
                    return;
                }

                const value = parseFloat(newValue);
                const today = formatDate(new Date());

                // 1. 儲存數據到 Firestore (使用 setDoc 模組化函數)
                const docRef = doc(getDailyDataCollectionRef(), today);
                await setDoc(docRef, {
                    [type]: value, // 使用計算屬性來動態設定欄位名稱
                    date: today
                }, { merge: true }); // 使用 merge: true 確保只更新特定欄位

                // 2. 更新前端顯示
                let formattedValue;
                if (type === 'weight') {
                    formattedValue = `${value.toFixed(1)} kg`;
                } else {
                    formattedValue = Math.round(value).toLocaleString();
                }
                displayElement.textContent = formattedValue;
                inputElement.value = ''; // 清空輸入欄
                
                // 成功訊息：確認 Firestore 已就緒並完成寫入
                showMessage(`${formattedValue} 數據已成功儲存！`);

                // 3. 重新繪製趨勢圖
                await fetchAndDrawCharts();

            } catch (error) {
                // 失敗訊息：通知使用者寫入失敗
                showMessage(`儲存數據失敗：${error.message}`, true);
                console.error("儲存數據失敗:", error);
            }
        }

        // -------------------------------------------------------------
        // D. 趨勢圖繪製邏輯
        // -------------------------------------------------------------
        let caloriesChartInstance;
        let weightChartInstance;

        /**
         * 繪製 Chart.js 圖表。
         * @param {string} canvasId - Canvas 元素的 ID.
         * @param {string} label - 圖表的標籤.
         * @param {Array} dates - 日期標籤 (x 軸).
         * @param {Array} data - 數值資料 (y 軸).
         */
        function drawChart(canvasId, label, dates, data) {
            const ctx = document.getElementById(canvasId);
            
            // 銷毀舊圖表實例 (避免重複繪製錯誤)
            let chartInstance = (canvasId === 'caloriesChart' ? caloriesChartInstance : weightChartInstance);
            if (chartInstance) {
                chartInstance.destroy();
            }

            const newChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    // 僅顯示月/日
                    labels: dates.map(d => d.substring(5)), 
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: '#19e65e', // Primary color
                        backgroundColor: 'rgba(25, 230, 94, 0.1)',
                        tension: 0.4, // 曲線平滑
                        fill: true,
                        pointRadius: 5,
                        pointHoverRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // 允許 Canvas 調整高度
                    plugins: {
                        legend: { display: false } // 隱藏圖例
                    },
                    scales: {
                        y: { 
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(25, 230, 94, 0.1)', // 網格線顏色
                            },
                        },
                        x: {
                            grid: {
                                display: false // 隱藏 X 軸網格線
                            }
                        }
                    }
                }
            });

            if (canvasId === 'caloriesChart') {
                caloriesChartInstance = newChartInstance;
            } else {
                weightChartInstance = newChartInstance;
            }
        }

        /**
         * 從 Firestore 獲取數據並繪製圖表。同時更新今日數據的顯示。
         */
        async function fetchAndDrawCharts() {
            try {
                // 確保 Firebase 認證已經完成
                if (userId === 'loading') return;

                // 1. 獲取最近 7 天數據 (使用模組化查詢)
                const q = query(
                    getDailyDataCollectionRef(), 
                    orderBy("date", "desc"), // 依日期降序排列
                    limit(7) // 僅取最近 7 天的數據
                );

                const snapshot = await getDocs(q);

                const rawData = {};
                let latestData = null; // 用來儲存最新一天的數據
                
                snapshot.forEach(doc => {
                    rawData[doc.id] = doc.data();
                    if (!latestData || doc.id > latestData.date) {
                        latestData = { ...doc.data(), date: doc.id };
                    }
                });
                
                // 2. 準備 7 天的日期標籤
                const dates = [];
                const today = new Date();
                // 獲取從 6 天前到今天的日期
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    dates.push(formatDate(date));
                }

                // 3. 整理圖表數據
                // Map 日期到對應的值，如果當天沒數據則為 null (Chart.js 會跳過)
                const caloriesData = dates.map(d => rawData[d]?.['calories-eaten'] || null);
                const weightData = dates.map(d => rawData[d]?.['weight'] || null);
                
                // 4. 繪製圖表
                drawChart('caloriesChart', '攝取熱量 (Kcal)', dates, caloriesData);
                drawChart('weightChart', '體重 (kg)', dates, weightData); 
                
                // 5. 更新今日活動數據顯示
                if (latestData) {
                    const todayKey = formatDate(new Date());
                    const todayRecord = rawData[todayKey];

                    document.getElementById('calories-eaten-display').textContent = (todayRecord?.['calories-eaten'] ? Math.round(todayRecord['calories-eaten']).toLocaleString() : '--');
                    document.getElementById('calories-burned-display').textContent = (todayRecord?.['calories-burned'] ? Math.round(todayRecord['calories-burned']).toLocaleString() : '--');
                    document.getElementById('steps-display').textContent = (todayRecord?.['steps'] ? Math.round(todayRecord['steps']).toLocaleString() : '--');
                    document.getElementById('weight-display').textContent = (todayRecord?.['weight'] ? todayRecord['weight'].toFixed(1) + ' kg' : '--');
                } else {
                    // 如果沒有任何數據，保持顯示 --
                    ['calories-eaten-display', 'calories-burned-display', 'steps-display', 'weight-display'].forEach(id => {
                        document.getElementById(id).textContent = '--';
                    });
                }


            } catch (error) {
                // 如果是權限錯誤，則會在這裡被捕獲
                showMessage(`載入數據失敗：${error.message}`, true);
                console.error("獲取或繪製圖表失敗:", error);
            }
        }

        // 頁面加載完成後，開始初始化 Firebase
        window.onload = function() {
            initializeFirebase();
        };
    </script>
</body>
</html>
