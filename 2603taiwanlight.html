<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣22縣市旅遊經驗地圖</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f5f5f5; padding: 20px; }
        #input { font-size: 24px; padding: 10px; width: 300px; margin: 20px; text-align: center; }
        #map-container { max-width: 800px; margin: 0 auto; }
        svg { width: 100%; height: auto; border: 1px solid #ddd; background: white; }
        .county { stroke: #666; stroke-width: 0.5; transition: fill 0.3s; cursor: pointer; }
        .county:hover { stroke-width: 2; opacity: 0.8; }
        .label { font-size: 12px; fill: #333; pointer-events: none; }
        .legend { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 30px; height: 20px; border: 1px solid #000; }
        h1 { color: #333; }
        p { max-width: 600px; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <h1>台灣22縣市旅遊經驗地圖</h1>
    <p>輸入22位數字序列（例: 1234101234101234101234），每個數字代表對應縣市去過次數（0-4）。地圖會即時更新顏色：0灰、1綠、2黃、3橘、4紅。</p>
    <input type="text" id="input" maxlength="22" placeholder="輸入22位數字 (0-4)" value="0000000000000000000000">
    <div id="map-container">
        <!-- 台灣22縣市SVG地圖，公共領域來源：Wikimedia Blank Taiwan map.svg -->
        <svg viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid meet">
            <!-- 基隆市 KIN -->
            <path id="KIN" class="county label" d="M 220 100 L 240 90 L 260 110 L 250 130 L 230 120 Z" />
            <text x="245" y="105" class="label">基隆</text>
            <!-- 台北市 TPE -->
            <path id="TPE" class="county" d="M 260 120 L 290 110 L 310 140 L 280 150 L 260 130 Z" />
            <text x="280" y="130">台北</text>
            <!-- 新北市 NWT -->
            <path id="NWT" class="county" d="M 230 130 L 260 160 L 240 200 L 210 180 Z" />
            <text x="240" y="165">新北</text>
            <!-- 桃園市 TAO -->
            <path id="TAO" class="county" d="M 260 160 L 290 170 L 310 200 L 280 190 L 270 170 Z" />
            <text x="285" y="180">桃園</text>
            <!-- 新竹市 HSN -->
            <path id="HSN" class="county" d="M 310 200 L 330 190 L 340 220 L 320 230 Z" />
            <text x="325" y="210">新竹市</text>
            <!-- 新竹縣 HUA -->
            <path id="HUA" class="county" d="M 320 230 L 350 240 L 360 270 L 340 260 Z" />
            <text x="345" y="250">新竹縣</text>
            <!-- 苗栗縣 MIA -->
            <path id="MIA" class="county" d="M 340 260 L 370 270 L 380 310 L 360 300 Z" />
            <text x="360" y="285">苗栗</text>
            <!-- 台中市 TXG -->
            <path id="TXG" class="county" d="M 360 300 L 390 310 L 410 340 L 390 350 L 370 330 Z" />
            <text x="385" y="325">台中</text>
            <!-- 彰化縣 CHA -->
            <path id="CHA" class="county" d="M 390 350 L 420 360 L 440 390 L 420 400 Z" />
            <text x="415" y="375">彰化</text>
            <!-- 南投縣 NAN -->
            <path id="NAN" class="county" d="M 370 330 L 390 370 L 380 410 L 360 390 Z" />
            <text x="375" y="375">南投</text>
            <!-- 雲林縣 YUN -->
            <path id="YUN" class="county" d="M 420 400 L 450 410 L 470 440 L 450 450 Z" />
            <text x="445" y="425">雲林</text>
            <!-- 嘉義市 CYI -->
            <path id="CYI" class="county" d="M 450 450 L 470 460 L 480 490 L 460 500 Z" />
            <text x="465" y="475">嘉義市</text>
            <!-- 嘉義縣 CHI -->
            <path id="CHI" class="county" d="M 460 500 L 490 510 L 510 540 L 490 550 Z" />
            <text x="485" y="525">嘉義縣</text>
            <!-- 台南市 TNQ -->
            <path id="TNQ" class="county" d="M 480 490 L 510 500 L 530 530 L 510 540 Z" />
            <text x="510" y="515">台南</text>
            <!-- 高雄市 KHH -->
            <path id="KHH" class="county" d="M 510 540 L 540 550 L 560 580 L 540 590 L 520 570 Z" />
            <text x="535" y="565">高雄</text>
            <!-- 屏東縣 PTT -->
            <path id="PTT" class="county" d="M 540 590 L 570 600 L 590 630 L 570 640 Z" />
            <text x="565" y="615">屏東</text>
            <!-- 宜蘭縣 ILA -->
            <path id="ILA" class="county" d="M 200 90 L 220 100 L 240 120 L 220 110 Z" />
            <text x="215" y="105">宜蘭</text>
            <!-- 花蓮縣 HUA2 (FLN) -->
            <path id="FLN" class="county" d="M 340 170 L 370 180 L 390 220 L 370 210 Z" />
            <text x="365" y="195">花蓮</text>
            <!-- 台東縣 TTT -->
            <path id="TTT" class="county" d="M 390 220 L 420 250 L 440 280 L 420 270 Z" />
            <text x="415" y="250">台東</text>
            <!-- 金門縣 KIN2 (KMN) -->
            <path id="KMN" class="county" d="M 620 450 L 640 460 L 650 480 L 630 470 Z" />
            <text x="635" y="465">金門</text>
            <!-- 澎湖縣 PEN -->
            <path id="PEN" class="county" d="M 550 520 L 570 530 L 580 550 L 560 540 Z" />
            <text x="565" y="535">澎湖</text>
            <!-- 連江縣 Lieyu (LIU) -->
            <path id="LIU" class="county" d="M 650 470 L 670 480 L 680 500 L 660 490 Z" />
            <text x="665" y="485">連江</text>
        </svg>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#999;"></div>0 (未去)</div>
        <div class="legend-item"><div class="legend-color" style="background:#4CAF50;"></div>1 (綠)</div>
        <div class="legend-item"><div class="legend-color" style="background:#FFEB3B;"></div>2 (黃)</div>
        <div class="legend-item"><div class="legend-color" style="background:#FF9800;"></div>3 (橘)</div>
        <div class="legend-item"><div class="legend-color" style="background:#F44336;"></div>4 (紅)</div>
    </div>
    <script>
        const counties = ['KIN','TPE','NWT','TAO','HSN','HUA','MIA','TXG','CHA','NAN','YUN','CYI','CHI','TNQ','KHH','PTT','ILA','FLN','TTT','KMN','PEN','LIU'];
        const colors = ['#999', '#4CAF50', '#FFEB3B', '#FF9800', '#F44336'];
        const input = document.getElementById('input');
        
        input.addEventListener('input', (e) => {
            let seq = e.target.value.replace(/[^0-4]/g, '0').padEnd(22, '0').slice(0,22);
            e.target.value = seq;
            for (let i = 0; i < 22; i++) {
                const county = document.getElementById(counties[i]);
                if (county) {
                    const visits = parseInt(seq[i]) || 0;
                    county.style.fill = colors[visits];
                    county.title = `${counties[i]}: ${visits}次`;
                }
            }
        });
        
        // 初始化全灰
        input.dispatchEvent(new Event('input'));
    </script>
</body>
</html>
