<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本軌跡動畫地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  body { margin:0; }
  #map { height: 100vh; width: 100%; }
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 初始化地圖
var map = L.map('map').setView([35, 137], 6);

// 底圖
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ===== 座標 =====
var points = [
[34.438284,135.24535],[34.435541,135.24357],[34.477273,135.39162],
[34.658514,135.50234],[34.664464,135.5022],[34.673536,135.50218],
[34.680602,135.49958],[34.689798,135.50359],[35.008846,135.78118],
[34.992075,135.81678],[35.011411,135.86394],[34.988527,135.89362],
[34.960602,135.90733],[34.967218,135.90336],[35.007277,135.87597],
[35.012897,135.85892],[35.032935,135.8531],[35.028308,135.85571],
[35.070112,135.87],[35.071275,135.8657],[35.070272,135.87815],
[35.096947,135.89451],[35.087502,135.89423],[35.091484,135.8983],
[35.097042,135.89458],[35.019994,135.85184],[35.013707,135.7937],
[35.010696,135.79389],[35.009886,135.79119],[35.003369,135.77056],
[34.736199,135.5661],[34.690724,135.50294],[34.690898,135.50123],
[34.672749,135.5009],[34.685088,135.49632],[34.680201,135.50098],
[34.683676,135.50105],[34.831951,135.489],[34.864182,135.49263],
[34.864462,135.49021],[34.854424,135.47291],[34.85093,135.47203],
[34.842202,135.47279],[34.845338,135.47349],[34.838006,135.46973],
[34.828961,135.46698],[34.681588,135.53346],[34.672491,135.50434],
[34.685118,135.49642],[34.681199,135.50029],[34.661471,135.50108],
[34.629235,135.52473],[34.608488,135.90866],[34.539501,135.90815],
[34.536396,135.90688],[34.534587,135.90782],[34.533682,135.90761],
[34.531473,135.90707],[34.531799,135.95835],[34.536267,136.04327],
[34.539184,136.0395],[34.536695,136.0513],[34.471262,135.82608],
[34.472422,135.82631],[34.463986,135.86149],[34.465713,135.86135],
[34.532039,135.59529],[34.603265,135.55035],[34.674097,135.49948],
[34.707325,135.49841],[34.710448,135.2189],[34.716436,135.216],
[34.720073,135.21607],[34.733969,135.20634],[34.738994,135.20433],
[34.753301,135.20866],[34.756905,135.22948],[34.751859,135.23706],
[34.73652,135.23768],[34.719487,135.23391],[34.746382,135.35612],
[34.752581,135.40843],[34.712156,135.40843],[34.671668,135.50008],
[34.680614,135.50101],[34.675003,135.50339],[34.685133,135.49702],
[34.69598,135.51274],[34.68524,135.4955],[34.680628,135.50001],
[34.660407,135.50118],[34.581562,135.46852],[34.460487,135.37869]
];

// ===== 軌跡線（黑色虛線）=====
var path = L.polyline([], {
    color: 'red',
    weight: 1,
    dashArray: '4,4'
}).addTo(map);

// ===== 動畫 =====
var i = 0;

function drawNext() {
    if (i >= points.length) return;

    var p = points[i];

    // 藍色小點
    L.circleMarker(p, {
        radius: 1,
        color: 'blue',
        fillColor: 'blue',
        fillOpacity: 0.8
    }).addTo(map);

    // 更新路徑
    path.addLatLng(p);

    // 地圖移動
    map.panTo(p, {animate: true, duration: 0.25});

    i++;
    setTimeout(drawNext, 80);
}

// 啟動
drawNext();

</script>

</body>
</html>
