<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入團體位置分享</title>
    <!-- 引入 LINE LIFF 與 Firebase SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h2>Joyiverse 團體定位驗證</h2>
    <div id="setup-form">
        <p>團隊編號: <input type="text" id="tripcode"></p>
        <p>通 行 碼: <input type="password" id="passcode"></p>
        <p>發送頻率: 
            <select id="interval">
                <option value="1">每 1 分鐘</option>
                <option value="5">朝 5 分鐘</option>
            </select>
        </p>
        <!-- 修改點：將按鈕拆開，方便切換顯示狀態 -->
        <button id="start-btn" onclick="startTracking()">確認並開始發送定位</button>
        <button id="stop-btn" onclick="stopTracking()" style="display:none; background-color: #ff4d4d; color: white;">停止發送</button>
    </div>
    <div id="status" style="margin-top: 20px; color: green; font-weight: bold;"></div>

    <script>
        // 1. 貼上你在 Firebase 後台複製的專案設定資訊
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userNickname = "匿名用戶";
        let userUid = "";
        let timer = null;
        let sendCount = 0;

        // 2. 初始化 LINE LIFF
        liff.init({ liffId: "你的_LIFF_ID" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                liff.getProfile().then(profile => {
                    userNickname = profile.displayName;
                    userUid = profile.userId;
                });
            }
        }).catch(err => console.error("LIFF 初始化失敗", err));

        // 3. 驗證與開始追蹤邏輯
        async function startTracking() {
            const tripcode = document.getElementById('tripcode').value;
            const passcode = document.getElementById('passcode').value;
            const intervalMinutes = parseInt(document.getElementById('interval').value);

            if(!tripcode || !passcode) return alert("請輸入編號與通行碼");

            // 前端直接去抓 Firestore 的 trips 集合驗證房號密碼
            const tripDoc = await db.collection("trips").doc(tripcode).get();
            if(!tripDoc.exists || tripDoc.data().passcode !== passcode) {
                return alert("團隊編號或通行碼錯誤！");
            }

            // 【新功能】對應需求 (5)：成功後將團體成員資料存入 Firestore 的 members 集合
            await db.collection("members").add({
                tripcode: tripcode,
                line_uid: userUid,
                nickname: userNickname,
                join_time: firebase.firestore.FieldValue.serverTimestamp()
            });

            // 調整 UI 顯示狀態：隱藏欄位，顯示停止按鈕
            document.getElementById('tripcode').disabled = true;
            document.getElementById('passcode').disabled = true;
            document.getElementById('interval').disabled = true;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('status').innerText = "驗證成功！開始發送定位...";

            // 【優化點】對應需求 (6)：按開始時將計數歸零，允許使用者「再按一次重新發送」
            sendCount = 0; 

            // 啟動定時器
            sendLocation(tripcode); // 先發送第一筆
            timer = setInterval(() => {
                sendLocation(tripcode);
            }, intervalMinutes * 60 * 1000);
        }

        // 【新功能】對應需求 (6)：主動停止發送功能
        function stopTracking() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            // 恢復 UI 欄位與按鈕狀態
            document.getElementById('tripcode').disabled = false;
            document.getElementById('passcode').disabled = false;
            document.getElementById('interval').disabled = false;
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('status').innerText = "已停止發送定位。若需再次發送，請重新點擊上方按鈕。";
        }

        // 4. 抓取 GPS 並寫入 Firestore
        function sendLocation(tripcode) {
            // 對應需求 (6)：最多發送 20 筆就自動停止
            if (sendCount >= 20) {
                stopTracking(); // 直接呼叫停止函式
                document.getElementById('status').innerText = "已自動停止（已達 20 筆上限）。若需要再發送，請再次點擊開始。";
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                db.collection("locations").add({
                    tripcode: tripcode,
                    line_uid: userUid,
                    nickname: userNickname,
                    lat: lat,
                    lng: lng,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    sendCount++;
                    document.getElementById('status').innerText = `定位發送中... 成功發送 ${sendCount}/20 筆資料`;
                });
            }, (err) => {
                alert("無法取得 GPS 定位，請確認手機定位與瀏覽器權限已開啟。");
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
