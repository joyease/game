<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我去過世界哪裡？255國家旅遊地圖</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; }
        #nickname { font-size: 28px; font-weight: bold; padding: 15px; width: 400px; border: 3px solid #ddd; border-radius: 10px; text-align: center; margin: 20px; letter-spacing: 3px; background: #f9f9f9; }
        #nickname:focus { border-color: #667eea; outline: none; box-shadow: 0 0 15px rgba(102,126,234,0.3); }
        button { font-size: 20px; padding: 15px 30px; margin: 0 10px; border: none; border-radius: 10px; cursor: pointer; background: #667eea; color: white; font-weight: bold; }
        button:hover { background: #5a67d8; }
        #status { margin: 20px 0; font-size: 18px; font-weight: bold; min-height: 30px; }
        #map { width: 100%; height: 700px; border: 3px solid #ddd; border-radius: 15px; background: #f8f9fa; margin: 20px 0; }
        .legend { display: flex; justify-content: center; gap: 30px; margin: 30px 0; flex-wrap: wrap; font-size: 18px; font-weight: bold; }
        .legend-item { display: flex; align-items: center; gap: 12px; background: white; padding: 15px 25px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .legend-color { width: 40px; height: 30px; border-radius: 8px; border: 3px solid #333; }
        #loading { display: none; color: #666; font-size: 16px; }
        #progress { margin: 10px 0; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 我去過世界哪裡？</h1>
        <p style="color:#666; font-size:20px;">255國家旅遊足跡，一目了然！</p>
        <input type="text" id="nickname" placeholder="輸入暱稱（如：世界旅行家）">
        <br><button onclick="loadUserData()">🔍 查詢我的世界地圖</button>
        <div id="status">輸入暱稱查看全球旅遊記錄</div>
        <div id="loading">🔄 載入世界地圖中...</div>
        <div id="progress"></div>
        
        <!-- 世界地圖SVG -->
        <svg id="map" viewBox="0 0 20000 10000" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;">
            <defs>
                <style>
                    .country { stroke: #555; stroke-width: 0.8; fill: #e0e0e0; transition: all 0.4s; cursor: pointer; }
                    .country:hover { stroke-width: 2; stroke: #000; opacity: 0.95; }
                </style>
            </defs>
            <g id="country-group"></g>
        </svg>
        
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#e0e0e0;"></div>0 (未去過)</div>
            <div class="legend-item"><div class="legend-color" style="background:#4CAF50;"></div>1次</div>
            <div class="legend-item"><div class="legend-color" style="background:#FFEB3B;"></div>2次</div>
            <div class="legend-item"><div class="legend-color" style="background:#FF9800;"></div>3次</div>
            <div class="legend-item"><div class="legend-color" style="background:#F44336;"></div>4次以上</div>
        </div>
    </div>

    <script>
        const colors = ['#e0e0e0','#4CAF50','#FFEB3B','#FF9800','#F44336'];
        let countriesData = [];
        let countryElements = {};
        
        // 🔥 載入世界地圖JSON
        async function initMap() {
            document.getElementById('loading').style.display = 'block';
            const progress = document.getElementById('progress');
            
            try {
                progress.textContent = '📥 下載 world_countries.json...';
                const response = await fetch('world_countries.json');
                const json = await response.json();
                countriesData = json.countries;
                
                // 🔥 動態建立255個國家path
                const group = document.getElementById('country-group');
                for(let i = 0; i < countriesData.length; i++) {
                    const country = countriesData[i];
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.id = country.id;
                    path.setAttribute("class", "country");
                    path.setAttribute('title', country.title);
                    path.setAttribute('d', country.path);
                    path.dataset.index = i;
                    countyElements[country.id] = path;
                    group.appendChild(path);
                    
                    // 🔥 進度顯示（每50國更新）
                    if(i % 50 === 0) {
                        progress.textContent = `🎨 繪製中... ${i+1}/${countriesData.length} 國家`;
                    }
                }
                
                progress.textContent = `✅ 世界地圖載入完成！${countriesData.length}個國家`;
                document.getElementById('loading').style.display = 'none';
                setTimeout(() => progress.textContent = '', 3000);
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerHTML = '❌ 無法載入 world_countries.json，請確認檔案存在';
                progress.textContent = '錯誤：' + error.message;
                console.error('JSON載入錯誤:', error);
            }
        }
        
        // 🔍 查詢用戶資料
        async function loadUserData() {
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) {
                document.getElementById('status').innerHTML = '⚠️ 請輸入暱稱';
                return;
            }
            
            document.getElementById('status').innerHTML = '🔄 載入用戶世界旅行記錄...';
            
            try {
                const response = await fetch('worlddata.json');
                if (!response.ok) throw new Error("worlddata.json 載入失敗");
                
                const data = await response.json();
                let foundSequence = data.users[nickname];
                
                // 🔥 自動補齊到255碼（支援短輸入）
                if (foundSequence && foundSequence.length < countriesData.length) {
                    foundSequence = foundSequence.padEnd(countriesData.length, '0');
                }
                
                if (foundSequence && foundSequence.length === countriesData.length) {
                    const visitedCount = foundSequence.split('').filter(n => n !== '0').length;
                    const percent = ((visitedCount / countriesData.length) * 100).toFixed(1);
                    document.getElementById('status').innerHTML = 
                        `✅ ${nickname} 去過 ${visitedCount}/${countriesData.length} 國家 (${percent}%)`;
                    updateMap(foundSequence);
                } else {
                    document.getElementById('status').innerHTML = `❌ 未找到 "${nickname}"<br>請確認 worlddata.json 有此暱稱`;
                }
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ 載入失敗，請確認 worlddata.json 存在';
                console.error('錯誤:', error);
            }
        }
        
        // 更新世界地圖顏色
        function updateMap(seq) {
            // 清除舊文字
            const existingTexts = document.querySelectorAll('#map text');
            existingTexts.forEach(t => t.remove());

            countriesData.forEach((country, i) => {
                const path = countryElements[country.id];
                if (path) {
                    const visits = parseInt(seq[i]) || 0;
                    path.style.fill = colors[visits] || '#e0e0e0';
                    path.title = `${country.title}: ${visits}次`;
                }
            });
        }
        
        // Enter鍵觸發
        document.getElementById('nickname').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadUserData();
        });
        
        // 🔥 頁面載入自動啟動
        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
